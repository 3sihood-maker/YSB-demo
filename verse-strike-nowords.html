<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Verse Strike · No Translation Experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#070a0e;--chrome:rgba(206,222,240,.6);--hot:#ffd166;--ok:#5fe0a0;--blue:#7cc8ff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d10;overflow:hidden}
body{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--chrome);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none;user-select:none;
  display:grid;place-items:center;height:100dvh}

/* ── the phone. Full screen on a phone; framed on anything wider. ── */
#phone{position:relative;overflow:hidden;width:100%;height:100%;background:var(--ink);container-type:size;--sat:calc(env(safe-area-inset-top,0px) + 28px);
  font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (min-width:520px){
  body{background:radial-gradient(120% 90% at 50% 20%,#1b2029,#0a0c10 70%)}
  #phone{--sat:28px;--sab:0px;height:min(844px,calc(100dvh - 56px));width:calc(min(844px,calc(100dvh - 56px))*390/844);
    border-radius:50px;isolation:isolate;
    box-shadow:0 0 0 11px #07080a,0 0 0 13px #2b3039,0 0 0 14px #0b0d10,0 40px 100px rgba(0,0,0,.65)}
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
#exp{position:absolute;z-index:30;left:0;right:0;top:0;height:calc(var(--sat));padding-top:calc(var(--sat) - 28px);
  display:flex;align-items:center;justify-content:center;background:#d7262b;color:#fff;
  font:700 11px/1 "IBM Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase}
#topbar{top:calc(var(--sat) - 28px)}

/* ── top bar, only when we are opened inside the YSB reader ── */
#topbar{position:absolute;z-index:9;top:0;left:0;right:0;height:calc(44px + var(--sat));
  padding-top:var(--sat);display:none;align-items:center;justify-content:space-between;
  background:linear-gradient(rgba(4,7,11,.86),rgba(4,7,11,0));pointer-events:none}
body.framed #topbar{display:flex}
#topbar button{pointer-events:auto;background:none;border:0;color:#eef6ff;cursor:pointer;
  font:600 15px/44px "Big Shoulders Display",Impact,sans-serif;letter-spacing:.04em;padding:0 16px;
  -webkit-tap-highlight-color:transparent}
#topbar #tbX{font-size:22px}

/* ── difficulty + day/night ── */
#ctl{position:absolute;z-index:7;left:10px;top:calc(10px + var(--sat));display:flex;gap:2px;
  padding:3px;border-radius:999px;background:rgba(4,7,11,.62);border:1px solid rgba(160,220,180,.14);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .8s ease}
body.ready #ctl{opacity:1}
body.framed #ctl{top:calc(52px + var(--sat))}
#ctl button{font:700 12px/1 "IBM Plex Mono",monospace;letter-spacing:0;
  text-transform:uppercase;padding:8px 9px 7px;border-radius:999px;border:0;cursor:pointer;
  background:none;color:rgba(214,232,244,.6);-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
#ctl button.on{background:var(--hot);color:#0a0d12}
#dayBtn{position:absolute;z-index:7;right:10px;top:calc(10px + var(--sat));width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:1px solid rgba(160,220,180,.14);
  background:rgba(4,7,11,.72);color:#ffe9a8;font:400 17px/1 system-ui,sans-serif;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .8s ease,background .2s;
  -webkit-tap-highlight-color:transparent}
body.ready #dayBtn{opacity:1}
body.framed #dayBtn{top:calc(52px + var(--sat))}
body.day #dayBtn{color:#eaf3ff}
#venBtn{position:absolute;z-index:7;right:52px;top:calc(10px + var(--sat));width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:1px solid rgba(160,220,180,.14);
  background:rgba(4,7,11,.72);font:400 17px/1 system-ui,sans-serif;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .8s ease,background .2s;
  -webkit-tap-highlight-color:transparent}
body.ready #venBtn{opacity:1}
body.framed #venBtn{top:calc(52px + var(--sat))}
#venBtn:hover{background:rgba(255,255,255,.14)}
#sndBtn{position:absolute;z-index:7;right:94px;top:calc(10px + var(--sat));width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:1px solid rgba(160,220,180,.14);
  background:rgba(4,7,11,.72);font:400 16px/1 system-ui,sans-serif;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .8s ease,background .2s;
  -webkit-tap-highlight-color:transparent}
body.ready #sndBtn{opacity:1}
body.framed #sndBtn{top:calc(52px + var(--sat))}
#sndBtn.off{opacity:.55}
#sndBtn:hover{background:rgba(255,255,255,.14)}
#dayBtn:hover{background:rgba(255,255,255,.14)}

/* ── the verse: a poster stamp over the stand ── */
#verse{position:absolute;z-index:3;left:50%;transform:translateX(-50%) rotate(-1.2deg);
  top:calc(58px + var(--sat));width:min(560px,92%);text-align:center;
  padding:12px 16px 14px;pointer-events:none;opacity:0;transition:opacity .8s ease,top .5s ease,width .5s ease;
  background:linear-gradient(100deg,rgba(6,9,14,.86),rgba(10,14,22,.78));
  border-left:6px solid var(--hot);
  clip-path:polygon(0 0,100% 2%,99% 100%,1% 98%);
  box-shadow:0 18px 50px rgba(0,0,0,.55)}
body.framed #verse{top:calc(100px + var(--sat))}
body.ready #verse{opacity:1}
#ref{display:inline-block;font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;
  font-size:12px;min-width:34px;letter-spacing:.26em;text-transform:uppercase;color:#0a0d12;background:var(--hot);
  padding:4px 9px 3px;transform:skewX(-10deg);margin-bottom:9px}
#ref.shown{animation:refIn .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes refIn{0%{transform:skewX(-10deg) scale(1.4);background:#fff}100%{transform:skewX(-10deg) scale(1)}}
#words{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(22px,6.2cqw,34px);line-height:1.02;letter-spacing:.01em;transition:font-size .6s ease}
#verse.mid #words{font-size:clamp(19px,5.2cqw,28px)}
#verse.long #words{font-size:clamp(15px,4.1cqw,22px);line-height:1.08;text-transform:none;letter-spacing:.02em}
#words span{color:transparent;-webkit-text-stroke:0 transparent;
  transition:color .45s ease,-webkit-text-stroke .45s ease,text-shadow .6s ease;display:inline}
#words span.on{color:#f7fbff;-webkit-text-stroke:0 transparent;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#words span.hot{color:var(--hot);text-shadow:0 0 18px rgba(255,209,102,.95),0 0 44px rgba(255,209,102,.55);
  animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(1.35) rotate(-3deg)}100%{transform:none}}

/* completed: the verse grows to fill the stand */
#verse.done{top:calc(56px + var(--sat));width:min(780px,96%);padding:20px 22px 18px;transform:translateX(-50%) rotate(0);
  border-left-width:8px;background:linear-gradient(100deg,rgba(6,9,14,.92),rgba(10,14,22,.86));
  box-shadow:0 22px 70px rgba(0,0,0,.6)}
body.framed #verse.done{top:calc(98px + var(--sat))}
#verse.done #words{font-size:clamp(24px,7.4cqw,42px)}
#verse.done.mid #words{font-size:clamp(21px,6.2cqw,34px)}
#verse.done.long #words{font-size:clamp(16px,4.6cqw,24px)}
#verse.done #ref{font-size:13px;margin-bottom:12px}
#done{display:none;margin-top:16px;gap:10px;justify-content:center;flex-wrap:wrap}
#verse.done #done{display:flex}
#done button{pointer-events:auto;font:700 16px/1 "Big Shoulders Display",Impact,sans-serif;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  padding:10px 18px;border-radius:999px;
  background:rgba(255,209,102,.14);color:#ffd166;
  border:1px solid rgba(255,209,102,.45);
  -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
#done button:hover{background:rgba(255,209,102,.9);color:#0a0d12}
#done .alt{background:rgba(180,220,200,.10);color:rgba(214,240,226,.85);
  border-color:rgba(180,220,200,.28)}
#done .alt:hover{background:rgba(214,240,226,.85);color:#0a0d12}

/* the one line that fades after the first kick */
#wise{position:absolute;z-index:3;left:50%;transform:translateX(-50%) rotate(-1.5deg);top:50%;
  font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-style:italic;
  font-size:clamp(17px,5.6cqw,26px);letter-spacing:.05em;text-transform:uppercase;line-height:1.05;
  padding:8px 16px 7px;background:var(--hot);color:#0a0d12;transform-origin:center;text-align:center;
  clip-path:polygon(1% 0,100% 4%,99% 100%,0 96%);width:max-content;max-width:86%;
  pointer-events:none;opacity:0;transition:opacity 1.4s ease,transform 1.4s ease}
body.ready #wise{opacity:1}
body.kicked #wise{opacity:0;transform:translateX(-50%) translateY(-18px) rotate(-1.5deg)}
#wise span{display:inline-block;font-style:normal;margin:0 3px;font-size:1.05em}
#wise .ar{font-size:.8em;opacity:.75}
#wise .bk{animation:bkglow 1.2s ease-in-out infinite alternate}
@keyframes bkglow{from{filter:drop-shadow(0 0 0 #fff)}to{filter:drop-shadow(0 0 10px #fff) brightness(1.3)}}

#hud{position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(12px + var(--sab));
  display:flex;justify-content:center;gap:16px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .8s ease;
  padding:7px 16px;border-radius:999px;background:rgba(4,8,6,.62);
  border:1px solid rgba(160,220,180,.12);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
body.ready #hud{opacity:1}
#hud b{color:#eef6ff;font-weight:500}
#hud .ok{color:var(--ok)}

#power{position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(52px + var(--sab));width:min(240px,58%);height:4px;
  border-radius:99px;background:rgba(255,255,255,.10);opacity:0;
  transition:opacity .18s ease;overflow:visible}
#power.on{opacity:1}
#powerFill{position:absolute;left:0;top:0;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#5fe0a0,#ffd166,#ff6b43);transform-origin:left}
#power .zone{position:absolute;top:-3px;height:10px;border-radius:2px;pointer-events:none}
#zGoal{left:14%;width:72%;background:rgba(95,224,160,.45)}
#zTop{left:58%;width:22%;background:rgba(255,209,102,.9);box-shadow:0 0 8px rgba(255,209,102,.8)}
#zlab{position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(38px + var(--sab));font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;opacity:0;transition:opacity .18s ease;pointer-events:none;white-space:nowrap}
#zlab.on{opacity:.7}
#zlab i{font-style:normal;color:var(--ok)} #zlab u{text-decoration:none;color:var(--hot)}

#toast{position:absolute;z-index:4;left:50%;top:34%;transform:translate(-50%,-50%) scale(.85);
  font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;
  font-size:clamp(28px,9cqw,58px);color:#fff;text-shadow:0 0 30px rgba(255,209,102,.85);
  opacity:0;pointer-events:none;transition:opacity .35s ease,transform .5s cubic-bezier(.2,1.5,.4,1)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#hint{position:absolute;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(58px + var(--sab));font-size:9px;letter-spacing:.18em;width:min(380px,92%);
  text-transform:uppercase;pointer-events:none;text-align:center;line-height:1.8;color:#eaf4ee;
  padding:10px 10px 6px;border-radius:12px;background:rgba(4,8,6,.72);
  border:1px solid rgba(160,220,180,.12);color:rgba(226,244,232,.85);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  max-width:min(420px,94%);transition:opacity .35s ease}
body.hintOff #hint{display:none}
#hintX{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;
  background:rgba(6,12,9,.95);border:1px solid rgba(160,220,180,.32);
  color:rgba(226,244,232,.9);font:400 13px/26px "IBM Plex Mono",monospace;text-align:center;
  pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
#hintX:hover{background:rgba(226,244,232,.9);color:#0a0d12}
#info{position:absolute;z-index:5;right:14px;bottom:calc(13px + var(--sab));
  width:32px;height:32px;border-radius:50%;display:none;place-items:center;
  background:rgba(4,8,6,.62);border:1px solid rgba(160,220,180,.18);
  color:rgba(226,244,232,.85);font:500 12px/1 "IBM Plex Mono",monospace;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-tap-highlight-color:transparent}
body.hintOff.ready #info{display:grid}
#info:hover{background:rgba(226,244,232,.85);color:#0a0d12}

#boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--ink);
  font-size:34px;animation:bootspin 1.2s linear infinite;letter-spacing:.28em;text-transform:uppercase;text-align:center;padding:24px;
  transition:opacity .8s ease}
body.ready #boot{opacity:0;pointer-events:none;animation:none}
@keyframes bootspin{to{transform:rotate(360deg)}}

/* Youth Sports Bible call-out, shown once the verse is finished */
#ysb{position:absolute;z-index:6;left:50%;transform:translateX(-50%) translateY(8px) scale(.94);
  top:60%;width:min(460px,88%);text-align:center;display:none;opacity:0;
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,1.3,.4,1)}
body.vdone #ysb{display:block}
body.vdone.vshow #ysb{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#ysb .cap{display:inline-block;font-family:"Big Shoulders Display",Impact,sans-serif;
  font-weight:700;font-size:clamp(17px,4.6cqw,23px);letter-spacing:.03em;
  color:#f4fdf8;margin-bottom:12px;padding:7px 16px 6px;border-radius:999px;
  background:rgba(4,8,6,.62);border:1px solid rgba(160,220,180,.16);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  text-shadow:0 2px 14px rgba(0,0,0,.85)}
#ysbBtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.55));
  transition:transform .18s ease}
#ysbBtn:hover{transform:scale(1.035)}
#ysbBtn:active{transform:scale(.97)}
#ysbBtn .paper{display:block;width:100%;height:auto}

#pop{position:absolute;inset:0;z-index:12;display:none;place-items:center;
  background:rgba(2,5,9,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#pop.on{display:grid}
#pop .box{width:min(400px,88%);padding:24px 22px 18px;border-radius:16px;text-align:center;
  background:rgba(8,14,12,.96);border:1px solid rgba(255,209,102,.30);
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
#pop p{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;
  font-size:clamp(17px,4.6cqw,23px);line-height:1.3;color:#f2fbf6;margin-bottom:18px}
#pop button{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;
  text-transform:uppercase;padding:12px 22px;border-radius:999px;cursor:pointer;
  background:rgba(255,209,102,.16);color:#ffd166;border:1px solid rgba(255,209,102,.45)}
#pop button:hover{background:rgba(255,209,102,.9);color:#0a0d12}
</style>
</head>
<body>
<div id="phone">
<canvas id="gl"></canvas>
<div id="exp">NO TRANSLATION EXPERIMENT</div>
<div id="topbar"><button id="tbBack" type="button">‹</button><button id="tbX" type="button" aria-label="Close">×</button></div>
<div id="ctl" role="group" aria-label="Difficulty"><button type="button" data-d="easy" aria-label="Easy">★</button><button type="button" data-d="medium" aria-label="Medium">★★</button><button type="button" data-d="hard" aria-label="Hard">★★★</button></div>
<button id="dayBtn" type="button" aria-label="Switch to day">☀</button>
<button id="venBtn" type="button" aria-label="Play in Brazil">🌴</button>
<button id="sndBtn" type="button" aria-label="Turn sound off">🔊</button>
<div id="verse"><div id="ref"></div><div id="words"></div>
  <div id="done"><button id="redo" type="button" aria-label="Redo this verse">🔁</button><button id="newv" class="alt" type="button" aria-label="Start a new verse">📖 ➜ ⏭</button></div></div>
<div id="wise"><span>⚽</span><span class="ar">➜</span><span>🥅</span><span class="ar">➜</span><span class="bk">📖</span></div>
<div id="hint"><div id="hintX">×</div><svg viewBox="0 0 320 112" width="100%" height="auto" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<!-- 1: drag swings the aim line -->
<g transform="translate(10,6)">
  <circle cx="44" cy="86" r="11" fill="#fff" stroke="none"/><circle cx="44" cy="86" r="11"/>
  <path d="M44 75 L44 14" stroke-dasharray="3 4"/>
  <path d="M14 30 Q44 2 74 30" stroke="#ffd166"/><path d="M14 30 L18 22 M14 30 L22 31" stroke="#ffd166"/><path d="M74 30 L70 22 M74 30 L66 31" stroke="#ffd166"/>
  <path d="M60 60 l0 -9 a4 4 0 0 1 8 0 l0 9 a4 4 0 0 1 8 0 l0 2 a4 4 0 0 1 8 0 l0 2 a4 4 0 0 1 8 0 l0 14 q0 10 -8 14 l-14 0 q-6 0 -10 -6 l-10 -14 a4 4 0 0 1 6 -5 l4 4 z" fill="rgba(255,255,255,.15)" stroke-width="1.6"/>
</g>
<!-- 2: tap, tap -->
<g transform="translate(118,6)">
  <circle cx="44" cy="86" r="11" fill="#fff" stroke="none"/><circle cx="44" cy="86" r="11"/>
  <g transform="translate(12,10) scale(.8)"><path d="M20 70 l0 -34 a5 5 0 0 1 10 0 l0 22 l6 0 a5 5 0 0 1 10 0 l0 2 a5 5 0 0 1 10 0 l0 2 a5 5 0 0 1 10 0 l0 20 q0 12 -10 18 l-18 0 q-8 0 -12 -8 l-12 -20 a5 5 0 0 1 8 -6 z" fill="rgba(255,255,255,.15)"/></g>
  <text x="18" y="22" font-family="IBM Plex Mono,monospace" font-size="13" fill="currentColor" stroke="none">①</text>
  <text x="62" y="22" font-family="IBM Plex Mono,monospace" font-size="13" fill="currentColor" stroke="none">②</text>
  <path d="M22 28 q6 -10 14 0" stroke="#ffd166" stroke-width="1.6"/><path d="M66 28 q6 -10 14 0" stroke="#ffd166" stroke-width="1.6"/>
</g>
<!-- 3: where you hit the ball -->
<g transform="translate(222,4)">
  <circle cx="40" cy="60" r="26" fill="rgba(255,255,255,.08)"/>
  <circle cx="40" cy="38" r="4" fill="#ffd166" stroke="none"/><path d="M40 30 L40 8 M82 10 L60 10" /><path d="M58 10 l4 -3 M58 10 l4 3"/>
  <path d="M46 14 Q64 8 78 10" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 3"/>
  <circle cx="40" cy="82" r="4" fill="#ffd166" stroke="none"/><path d="M40 90 Q44 104 86 100"/><path d="M58 102 Q72 90 86 100" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 3"/><path d="M84 100 l-4 -3 M84 100 l-4 3" transform="translate(2,0)"/>
  <circle cx="16" cy="60" r="4" fill="#ffd166" stroke="none"/><path d="M8 60 Q-6 54 0 40 Q4 30 18 28" stroke="#ffd166"/><path d="M18 28 l-4 -3 M18 28 l-3 4" stroke="#ffd166"/>
  <circle cx="64" cy="60" r="4" fill="#ffd166" stroke="none"/><path d="M72 60 Q86 54 80 40 Q76 30 62 28" stroke="#ffd166"/><path d="M62 28 l4 -3 M62 28 l3 4" stroke="#ffd166"/>
</g>
</svg></div>
<div id="power"><div id="powerFill"></div><div class="zone" id="zGoal"></div><div class="zone" id="zTop"></div></div>
<div id="zlab"><i>■</i> 🥅 &nbsp;&nbsp; <u>■</u> ★</div>
<div id="hud"><span>🥅 <b id="hits">0</b>/8</span><span>🧤 <b id="tops" class="ok">0</b></span><span>⚽ <b id="shots">0</b></span><span hidden>f/<b id="fst">5.6</b></span></div>
<div id="info">?</div>
<div id="ysb">

/* A shuffled deck, kept on the phone: no verse comes round again until all
   ten have been seen. */
const DECK_KEY='vs.deck.v2', LAST_KEY='vs.last.v2';
const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},
             set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
function drawVerse(){
  let deck=[];try{deck=JSON.parse(store.get(DECK_KEY)||'[]');}catch(e){deck=[];}
  deck=deck.filter(i=>Number.isInteger(i)&&i>=0&&i<VERSES.length);
  if(!deck.length){
    deck=VERSES.map((_,i)=>i);
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
    const last=parseInt(store.get(LAST_KEY));
    if(deck.length>1&&deck[0]===last){const j=1+Math.floor(Math.random()*(deck.length-1));[deck[0],deck[j]]=[deck[j],deck[0]];}
  }
  const v=deck.shift(); store.set(DECK_KEY,JSON.stringify(deck)); store.set(LAST_KEY,String(v));
  return v;
}

 len:a=>Math.hypot(a[0],a[1],a[2]),

 crs:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]};
const M={
 persp:(f,a,n,fa)=>{const t=1/Math.tan(f/2),nf=1/(n-fa);
   return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(fa+n)*nf,-1,0,0,2*fa*n*nf,0]);},
 look:(e,c,u)=>{const z=V.nrm(V.sub(e,c)),x=V.nrm(V.crs(u,z)),y=V.crs(z,x);
   return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,
     -V.dot(x,e),-V.dot(y,e),-V.dot(z,e),1]);},
 mul:(a,b)=>{const o=new Float32Array(16);
   for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}
   return o;},
 trs:(t,s)=>new Float32Array([s[0],0,0,0,0,s[1],0,0,0,0,s[2],0,t[0],t[1],t[2],1]),
 yaw:(t,s,a)=>{const c=Math.cos(a),si=Math.sin(a);
   return new Float32Array([c*s[0],0,-si*s[0],0, 0,s[1],0,0, si*s[2],0,c*s[2],0, t[0],t[1],t[2],1]);},
 rotZ:(t,s,a)=>{const c=Math.cos(a),si=Math.sin(a);
   return new Float32Array([c*s[0],si*s[0],0,0, -si*s[1],c*s[1],0,0, 0,0,s[2],0, t[0],t[1],t[2],1]);},
 q:(q,s,p)=>{const x=q[0],y=q[1],z=q[2],w=q[3];
   const m=[1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),0, 2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),0,
            2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y),0,0,0,0,1];
   for(let c=0;c<3;c++)for(let r=0;r<3;r++)m[c*4+r]*=s[c];
   m[12]=p[0];m[13]=p[1];m[14]=p[2];return new Float32Array(m);},
 nrmM:m=>{const a=[m[0],m[1],m[2],m[4],m[5],m[6],m[8],m[9],m[10]];
   const d=a[0]*(a[4]*a[8]-a[5]*a[7])-a[1]*(a[3]*a[8]-a[5]*a[6])+a[2]*(a[3]*a[7]-a[4]*a[6]);
   const i=1/(d||1e-9);
   return new Float32Array([(a[4]*a[8]-a[5]*a[7])*i,(a[2]*a[7]-a[1]*a[8])*i,(a[1]*a[5]-a[2]*a[4])*i,
     (a[5]*a[6]-a[3]*a[8])*i,(a[0]*a[8]-a[2]*a[6])*i,(a[2]*a[3]-a[0]*a[5])*i,
     (a[3]*a[7]-a[4]*a[6])*i,(a[1]*a[6]-a[0]*a[7])*i,(a[0]*a[4]-a[1]*a[3])*i]);}
};

uniform float uDay;
const vec3 KEY=normalize(vec3(-0.30,0.88,0.36));
const vec3 FILL=normalize(vec3(0.78,0.28,-0.32));
vec3 keyCol(){return mix(vec3(1.0,0.98,0.94),vec3(1.0,0.96,0.86)*1.12,uDay);}
vec3 fillCol(){return mix(vec3(0.45,0.60,0.95)*0.85,vec3(0.55,0.68,0.95)*1.3,uDay);}
vec3 ambIrr(vec3 n){
  float up=clamp(n.y*0.5+0.5,0.0,1.0);

float D_GGX(float NoH,float a){float a2=a*a;float x=(NoH*a2-NoH)*NoH+1.0;return a2/(3.14159*x*x+1e-7);}
float V_Sm(float NoV,float NoL,float a){float a2=a*a;
  float lv=NoL*sqrt(NoV*NoV*(1.0-a2)+a2), ll=NoV*sqrt(NoL*NoL*(1.0-a2)+a2);

vec3 F_S(vec3 f0,float u){return f0+(1.0-f0)*pow(1.0-u,5.0);}
vec3 tone(vec3 x){const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;

/* pitch: mown stripes and the real box markings, in metres */
const F_PITCH=H+LIGHT+`
in vec3 vW,vN; in vec2 vUv; out vec4 frag;
uniform vec3 uEye,uBall,uL1,uL2; uniform float uVenue;
float band(float v,float w,float aa){return 1.0-smoothstep(w-aa,w+aa,abs(v));}
void main(){
  vec2 p=vW.xz;
  float aa=max(fwidth(p.x),fwidth(p.y))*0.9;
  float w=max(0.055,aa);
  // sampled from the stadium photo's own turf, converted to linear
  vec3 g1=vec3(0.1180,0.1520,0.0480)*mix(1.0,1.35,uDay), g2=vec3(0.0790,0.1055,0.0180)*mix(1.0,1.35,uDay);
  float mow=sin(p.y*3.14159/4.0);
  vec3 col=mix(g1,g2,smoothstep(-0.35,0.35,mow));
  // blades: fine cross-hatched noise at two scales, plus a coarse wear pattern
  // fine grain only where a cell still covers a pixel or two, otherwise its
  // average, so nothing twinkles as the camera drifts
  float f1=1.0-smoothstep(0.004,0.016,aa), f2=1.0-smoothstep(0.08,0.3,aa);
  float b1=mix(0.5,hash21(floor(p*vec2(46.0,150.0))),f1);
  float b2=mix(0.5,hash21(floor(p*vec2(150.0,46.0)+37.0)),f1);
  float wear=mix(0.5,hash21(floor(p*3.2)),f2);
  col*=0.80+0.26*b1;
  col*=0.88+0.18*b2;
  col*=0.94+0.10*wear;
  col*=0.97+0.06*sin(p.x*11.0+p.y*3.0);
  // sheen along the mow direction, so the stripes read as pile not paint
  vec3 Vv=normalize(uEye-vW);
  col+=vec3(0.055,0.062,0.040)*pow(max(1.0-Vv.y,0.0),3.0)*(0.45+0.55*smoothstep(-0.2,0.2,mow));
  if(uVenue>0.001){
    // packed red earth: coarse grain, pale worn patches, a little stone
    vec3 d1=vec3(0.42,0.135,0.028)*mix(1.0,1.15,uDay), d2=vec3(0.29,0.085,0.018)*mix(1.0,1.15,uDay);
    float e1=mix(0.5,hash21(floor(p*vec2(34.0,34.0))),1.0-smoothstep(0.01,0.03,aa));
    float e2=mix(0.5,hash21(floor(p*6.5+3.0)),1.0-smoothstep(0.05,0.15,aa));
    float e3=mix(0.5,hash21(floor(p*150.0+7.0)),f1);
    vec3 dirt=mix(d1,d2,0.55*e1+0.45*e2)*(0.86+0.28*e3);
    float worn=smoothstep(0.55,0.9,0.5*hash21(floor(p*0.7+11.0))+0.5*hash21(floor(p*1.9+4.0)))*smoothstep(0.3,0.7,e2);
    dirt=mix(dirt,vec3(0.52,0.22,0.07)*mix(1.0,1.15,uDay),0.28*worn);
    col=mix(col,dirt,uVenue);
  }
  float m=0.0;
  m=max(m,band(p.y-(-9.0),w,aa));                                   // goal line
  m=max(m,band(abs(p.x)-9.16,w,aa)*step(p.y,-3.5)*step(-9.0,p.y));  // 6 yard
  m=max(m,band(p.y-(-3.5),w,aa)*step(abs(p.x),9.16));
  float full=1.0-uVenue;   // the dirt pitch has only the goal line and the small box
  m=max(m,band(abs(p.x)-20.16,w,aa)*step(p.y,7.5)*step(-9.0,p.y)*full);  // 18 yard
  m=max(m,band(p.y-7.5,w,aa)*step(abs(p.x),20.16)*full);
  // (penalty spot removed: band() draws a ring, which read as a white donut)
  float arc=band(length(p-vec2(0.0,2.0))-9.15,w,aa)*step(7.5,p.y)*full;
  m=max(m,arc);
  // chalk on dirt is patchier than paint on turf
  float chalk=mix(1.0,0.55+0.45*mix(0.5,hash21(floor(p*vec2(3.0,40.0))),1.0-smoothstep(0.01,0.03,aa)),uVenue);
  col=mix(col,mix(vec3(0.88,0.92,0.88),vec3(0.86,0.83,0.76),uVenue),clamp(m,0.0,1.0)*chalk);
  // Two floodlights, so everything throws two shadows. A directional light L
  // drops a point at height h onto the ground at p - L.xz*(h/L.y).
  // The directions drift slowly, so the shadows swing with them.
  float sh=1.0;
  for(int i=0;i<2;i++){
    vec3 L=normalize(i==0?uL1:uL2);
    vec2 slide=L.xz/L.y;
    float shw=i==0?1.0:(1.0-uDay);     // by day only the sun throws a shadow
    // ball
    vec2 bg=uBall.xz-slide*uBall.y;
    float soft=0.10+uBall.y*0.16;
    float rb=0.115+uBall.y*0.10;
    sh*=1.0-0.42*shw*(1.0-smoothstep(rb-soft,rb+soft,length(p-bg)))*exp(-uBall.y*0.28);
    // crossbar: a horizontal segment at 2.44 m
    vec2 cA=vec2(-3.66,-9.0)-slide*2.44, cB=vec2(3.66,-9.0)-slide*2.44;
    vec2 pa=p-cA, ba=cB-cA;
    float hh=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
    sh*=1.0-0.30*shw*(1.0-smoothstep(0.06,0.30,length(pa-ba*hh)));
    // posts: verticals, so their shadows run along the slide direction
    for(int k=0;k<2;k++){
      vec2 f=vec2(k==0?-3.66:3.66,-9.0);
      vec2 a2=f, b2=f-slide*2.44;
      vec2 pa2=p-a2, ba2=b2-a2;
      float h2=clamp(dot(pa2,ba2)/dot(ba2,ba2),0.0,1.0);
      sh*=1.0-0.28*shw*(1.0-smoothstep(0.05,0.26,length(pa2-ba2*h2)));
    }
  }
  // contact shadow: a tight dark core directly beneath the ball, independent
  // of either light, so it still reads as touching the turf
  {
    float hb=max(uBall.y-0.11,0.0);
    float rc=0.105+hb*0.16;
    float dc=length(p-uBall.xz);
    sh*=1.0-0.62*(1.0-smoothstep(rc*0.35,rc*1.35,dc))*exp(-hb*1.25);
  }
  vec3 N=vec3(0,1,0);
  float NoL=max(dot(N,KEY),0.0);
  col=col*(ambIrr(N)*2.2+keyCol()*1.55*NoL*sh);
  col*=1.0-smoothstep(26.0,64.0,length(p))*mix(mix(0.85,0.18,uDay),0.12,uVenue);
  frag=vec4(tone(col),1.0);}`;

const F_STAD=H+LIGHT+`

  float aa=max(fwidth(uv.x),fwidth(uv.y))*1.1;
  if(uKind<0.5){ // seats: 0.5 m wide, 0.82 m row pitch, an aisle every 13 m
    float SW=0.5, RP=0.82, block=13.0, aisle=1.1;
    float bl=mod(uv.x+6.5,block);
    float row=floor(uv.y/RP), fr=fract(uv.y/RP);
    float sx=uv.x+mod(row,2.0)*0.25;
    float col=floor(sx/SW), fc=fract(sx/SW);
    float h=hash21(vec2(col,row));
    float rowShade0=1.0; vec3 blue=vec3(0.022,0.105,0.52)*(0.82+0.34*mix(0.5,h,1.0-smoothstep(0.02,0.08,aa)));
    vec3 tread=vec3(0.15,0.16,0.18);
    float back=rrect(vec2(fc-0.5,fr-0.64)*vec2(SW,RP),vec2(SW*0.43,RP*0.24),0.05);
    float seat=rrect(vec2(fc-0.5,fr-0.30)*vec2(SW,RP),vec2(SW*0.41,RP*0.15),0.04);
    float mB=1.0-smoothstep(-aa,aa,back), mS=1.0-smoothstep(-aa,aa,seat);
    alb=tread; alb=mix(alb,blue*0.70,mS); alb=mix(alb,blue,mB);
    alb=mix(alb,blue*0.55,mB*step(0.94,h));            // the odd folded seat
    alb=mix(alb,mix(tread,blue*0.86,0.62)*rowShade0,smoothstep(0.06,0.18,aa));   // too far to resolve: average it
    if(bl>block-aisle){ alb=vec3(0.30,0.31,0.33)*(0.84+0.22*step(0.5,fr)); } // stairs
    float rowShade=mix(0.70+0.30*smoothstep(0.0,0.5,fr),0.85,smoothstep(0.06,0.18,aa));  // each row shadows the one below
    alb*=rowShade;
  } else if(uKind<1.5){ // hoarding with a white LED strip
    alb=vec3(0.030,0.034,0.044);
    float led=smoothstep(0.58,0.63,uv.y)*(1.0-smoothstep(0.93,0.98,uv.y));
    float seg=step(0.08,fract(uv.x/6.0));              // panel joins
    alb=mix(alb,vec3(0.55),led*seg); emit=led*seg*mix(2.6,0.9,uDay); ecol=vec3(0.95,0.97,1.0);
  } else if(uKind<2.5){ // suite band: concrete with lit glass
    alb=vec3(0.12,0.125,0.14);
    float wx=mod(uv.x,3.4), wi=floor(uv.x/3.4);
    float win=step(0.25,wx)*step(wx,3.15)*step(0.55,uv.y)*step(uv.y,1.85);
    win=mix(0.6,win,1.0-smoothstep(0.08,0.25,aa));
    float wh=hash21(vec2(wi,3.0));
    vec3 glassN=vec3(0.95,0.78,0.50)*(0.9+0.5*wh), glassD=vec3(0.50,0.60,0.76);

    emit=win*mix(1.0*(0.5+0.6*step(0.25,wh)),0.12,uDay); ecol=mix(glassN,vec3(0.8,0.9,1.0),uDay);
    float mull=step(0.92,fract(wx/0.72))*(1.0-smoothstep(0.01,0.04,aa)); alb=mix(alb,vec3(0.10),win*mull); emit*=1.0-win*mull;

    alb=vec3(0.10,0.105,0.12); flood=0.6;

    alb=vec3(0.50,0.52,0.55);

function blip(f,dec,noisy,amp,type){
  if(!sound)return;const c=audio();if(c.state==='suspended')c.resume();
  const t=c.currentTime,out=c.createGain();out.gain.value=amp;out.connect(c.destination);
  const s=c.createBufferSource();s.buffer=noiseBuf;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*1.5;bp.Q.value=1.3;
  const ng=c.createGain();ng.gain.setValueAtTime(noisy,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+dec*0.8);
  s.connect(bp);bp.connect(ng);ng.connect(out);s.start(t);s.stop(t+dec+0.05);
  const o=c.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f*1.2,t);o.frequency.exponentialRampToValueAtTime(f*0.8,t+dec);
  const og=c.createGain();og.gain.setValueAtTime(1.0-noisy*0.5,t);
  og.gain.exponentialRampToValueAtTime(0.0001,t+dec);
  o.connect(og);og.connect(out);o.start(t);o.stop(t+dec+0.05);}

    if(wl>1e-4){const ang=wl*dt,ax=V.scl(w,1/wl),s=Math.sin(ang/2),c2=Math.cos(ang/2);

      ball.q=[dq[3]*q[0]+dq[0]*q[3]+dq[1]*q[2]-dq[2]*q[1],
              dq[3]*q[1]-dq[0]*q[2]+dq[1]*q[3]+dq[2]*q[0],
              dq[3]*q[2]+dq[0]*q[1]-dq[1]*q[0]+dq[2]*q[3],
              dq[3]*q[3]-dq[0]*q[0]-dq[1]*q[1]-dq[2]*q[2]];

function ballScreen(){
  const p=[ball.p[0],ball.p[1],ball.p[2],1],o=[0,0,0,0];
  for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=curVP[k*4+r]*p[k];o[r]=s;}
  if(o[3]<=0)return null;
  return {x:(o[0]/o[3]*0.5+0.5)*RW(),y:(1-(o[1]/o[3]*0.5+0.5))*RH(),
          r:Math.abs(curVP[0])*BALL_R/o[3]*RW()*0.5};}
root.addEventListener('pointerdown',e=>{
  if(onUI(e))return;
  audio();
  const [cx,cy]=rel(e);
  panXT=(cx/RW())*2-1;panYT=-((cy/RH())*2-1);
  if(ball.live||verseDone)return;
  const s=ballScreen();if(!s)return;
  const near=Math.hypot(cx-s.x,cy-s.y)<Math.max(80,s.r*3.0);
  const now=performance.now();
  if(!armed){if(near){armed=true;armT=now;powerEl.classList.add('on');zlab.classList.add('on');}}
  else{
    const bar=Math.max(0,1-(now-armT)/1200);
    // contact point, in ball radii. The strike zone is wider than the ball so
    // a fingertip can still place the contact meaningfully.
    // contact strictly on the ball itself, so the map is 1:1 with what you see
    const R=Math.max(20,s.r);
    const ux=Math.max(-1,Math.min(1,(cx-s.x)/R));
    const uy=Math.max(-1,Math.min(1,(cy-s.y)/R));
    lastHit=[cx,cy]; hitT=1;
    armed=false;powerEl.classList.remove('on');zlab.classList.remove('on');
    strike(bar,ux,uy);}
},{passive:true});

function updateNet(){
  const n=netBase.length/3;
  for(let i=0;i<n;i++){
    const x=netBase[i*3],y=netBase[i*3+1],z=netBase[i*3+2];
    if(netHit>0.001){
      const d=Math.hypot(x-netHitP[0],y-netHitP[1],(z-netHitP[2])*0.7);
      const k=netHit*Math.exp(-d*d*1.1);
      netLive[i*3]=x+k*(netHitP[0]-x)*0.35;
      netLive[i*3+1]=y+k*(netHitP[1]-y)*0.25-k*0.05;
      netLive[i*3+2]=z-k*0.42;
    } else {netLive[i*3]=x;netLive[i*3+1]=y;netLive[i*3+2]=z;}
  }
  gl.bindVertexArray(netVao);gl.bindBuffer(gl.ARRAY_BUFFER,netBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,netLive);}

      gl.uniformMatrix4fv(uGlow.uModel,false,mm);gl.uniformMatrix3fv(uGlow.uNrmM,false,M.nrmM(mm));
      gl.uniform3f(uGlow.uCol,0.80,0.86,1.0);
      gl.uniform1f(uGlow.uGain,0.95*(1.0-day)*(0.86+0.14*Math.sin(now*0.0011+b.ph)));
      gl.drawElements(gl.TRIANGLES,mQuad.count,gl.UNSIGNED_SHORT,0);}
  }
  gl.useProgram(pShaft);gl.bindVertexArray(mCone.vao);
  gl.uniformMatrix4fv(uShaft.uVP,false,VP);
  gl.uniform3f(uShaft.uEye,eye[0],eye[1],eye[2]);
  gl.uniform1f(uShaft.uTime,now*0.001);
  for(let i=0;i<RIG.length&&day<0.98&&venue<0.5;i++){
    const L=RIG[i];
    const sw=0.62+0.38*Math.sin(now*0.00042+L.ph);         // slow swell
    const wob=Math.sin(now*0.00019+L.ph*1.7)*1.6;          // slow sweep
    const ax=[L.aim[0]+wob-L.p[0], -L.p[1], L.aim[2]-L.p[2]];
    const len=Math.hypot(ax[0],ax[1],ax[2]);
    const dir=[ax[0]/len,ax[1]/len,ax[2]/len];
    const rad=len*0.22;
    // orient the cone's -Y down the beam
    const up=[0,-1,0];
    const v=V.crs(up,dir), c2=V.dot(up,dir), k=1/(1+c2);
    const m3=[v[0]*v[0]*k+c2, v[0]*v[1]*k+v[2], v[0]*v[2]*k-v[1],
              v[1]*v[0]*k-v[2], v[1]*v[1]*k+c2, v[1]*v[2]*k+v[0],
              v[2]*v[0]*k+v[1], v[2]*v[1]*k-v[0], v[2]*v[2]*k+c2];
    const S=[rad,len,rad];
    const mm=new Float32Array([
      m3[0]*S[0],m3[1]*S[0],m3[2]*S[0],0,
      m3[3]*S[1],m3[4]*S[1],m3[5]*S[1],0,
      m3[6]*S[2],m3[7]*S[2],m3[8]*S[2],0,
      L.p[0],L.p[1],L.p[2],1]);
    gl.uniformMatrix4fv(uShaft.uModel,false,mm);
    gl.uniformMatrix3fv(uShaft.uNrmM,false,M.nrmM(mm));
    gl.uniform3f(uShaft.uCol,L.col[0],L.col[1],L.col[2]);
    gl.uniform1f(uShaft.uGain,0.115*sw*(1.0-day));
    gl.drawElements(gl.TRIANGLES,mCone.count,gl.UNSIGNED_SHORT,0);
  }
  gl.enable(gl.CULL_FACE);
  gl.depthMask(true);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

  requestAnimationFrame(tick);
})(last);
}

}catch(err){fail(err&&err.message?err.message:err);}})();
