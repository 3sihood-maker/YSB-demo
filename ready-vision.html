<script>
const COURSE = {"title":"Ready: Vision","source":"https://readysetgo.pathwright.com/library/ready-vision-228411/645059/path/","about":"So, you love Jesus, and you love sports. Great! This course will help you combine these in a way that will change and empower your life.\nThis course has 8 sessions. Each session will take you between 20 and 40 minutes to complete. You will also be encouraged to find ways to apply what you have learned in your daily life.\n\nHere are the topics:\n1. What is ReadySetGo?\n2. The power and potential of sport?\n3. How does the sport movement operate?\n4. How can ReadySetGo help a sportsperson?\n5. How ReadySetGo can help a local church?\n6. Go strategies\n7. The history of the sport movement\n8. Time for action\n\nRemember, the more you put into it, the more you’ll get out of it. You can do this course alone or with others. You can decide.","sections":[{"n":1,"title":"What is ReadySetGo","steps":[{"n":1,"pathwright_id":339715091,"type":"todo","label":"Reflection Question","heading":"Reflection Questions","body":"How do you connect your love of sport with your love for Jesus?\n\nWhat does this look like practically?","youtube":null},{"n":2,"pathwright_id":339715092,"type":"read","label":"Intro to the Topic","heading":"Introduction","body":"You’re here to run the race. It’s the race of your life. Imagine the electrifying energy at a starting line. You've trained hard, your muscles buzzing with anticipation. \"Ready...\" The crowd roars! \"Set...\" Your focus narrows. And then... \"GO!\" You spring forward, fueled by passion and purpose. You’re running your race!\n\nMaybe you're a one-sport fanatic, a multi-sport enthusiast, a casual player, or a pro athlete. You might only watch sports, or perhaps you play regularly. Maybe you simply connect with others through the community and fun that sports provides. Whatever your passion, here's the exciting news: faith and sports can be a powerful combination! Let’s explore this more!","youtube":null},{"n":3,"pathwright_id":339715093,"type":"watch","label":"The Teaching Video","heading":"What is ReadySetGo","body":"","youtube":"FU8JiolxHRI"},{"n":4,"pathwright_id":339715094,"type":"read","label":"Dive Deeper","heading":"What is ReadySetGo?","body":"Connecting Faith and Sports: Ready, Set, Go!\n\nSport and faith don’t have to live in two different worlds. Sport can be a place where you intentionally live out your faith in Jesus.\n\nHave you ever wondered how to share your faith in Jesus with others who love sports? The good news is sports are an amazing place to make disciples (followers of Christ)!\n\nThe World of Sports: A Huge Universe\n\nThere are billions of people around the world who love sports, whether they're playing, watching, or both! From soccer and surfing to fitness and gaming, there's a sport for everyone. And the best part? That's exactly where God can use you!\n\nFinding Your Zone: Where You Shine\n\nThink about the sports world like a giant park. You probably have a favorite area, such as the soccer field, the basketball court, a pool, or a bike track. That's your \"zone\" – the place where you feel most comfortable and have the most experience. That's where God wants you to be a light for Him!\n\nReady, Set, Go! Making Disciples in Sports\n\nSo, making disciples is like a race, and \"Ready, Set, Go!\" is a great way to remember the steps involved:\n\nReady: This is about getting a vision for connecting your love or sport with your faith in Jesus - seeing all the opportunities to show your faith on the sports field. It’s about getting a new mindset – being intentional about growing in wholeness and character so that when people see you playing, they get a good look at Jesus. It is about seeing the people around you as potential disciples. Sports teams can be amazing communities where people can grow together in their faith.\nSet: This is about equipping yourself with the skills to share your faith and help others grow as disciples of Jesus. You need to handle the Bible well. You need to know how to make disciples of Jesus. You need to know how to start and build teams. Many resources are available to help you learn more about the Bible and how to share your faith with others.\nGo!: This is about putting your knowledge into action! There are many practical ways to share your faith in a sports setting, and you can find resources and ideas to fit your specific situation. Chaplaincy, camps, whole life coaching, and festivals – there are many strategies to combine sport and faith.\n\nRemember, you're not alone! Many people around the world are using sports to share their faith, and there are resources available to help you get started. So get out there, share your passion for Jesus, and watch your corner of the sports world be transformed!","youtube":null},{"n":5,"pathwright_id":339715095,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"sQRru4_iU0s"},{"n":6,"pathwright_id":339715096,"type":"watch","label":"The Vision of the sport movement","heading":"The Vision","body":"","youtube":"I_pK0Yyojlk"},{"n":7,"pathwright_id":339715097,"type":"todo","label":"Live it Out","heading":"Live it Out Application","body":"What is your vision for living out your faith in Jesus as you play sports?\nHow could sports, fitness, and play help you do this?\nMemorize this scripture. Matthew 28:18b:\n\n\"Go into all the world and make disciples.\"\n\nHelpful Links:\n\nReady Set Go Website\n\nReady Set Go YouTube Channel","youtube":null}]},{"n":2,"title":"The Power and Potential of Sport","steps":[{"n":8,"pathwright_id":339715099,"type":"todo","label":"Reflection Questions","heading":"Reflection Questions","body":"Why do people love sports so much?\n\nWhy do you love sport?\n\nOthers have said:\n\nPeople love sports because we stay fit; get excitement in my week; it’s a healthy outlet for my competitiveness; sports is my real talent; I hang out with others; I just love the feeling of freedom; I love to train hard and accomplish something difficult; it’s fun; it fills my tank; I’m just really competitive.","youtube":null},{"n":9,"pathwright_id":339715100,"type":"watch","label":"The Teaching Video","heading":"The Power and Potential of Sport","body":"","youtube":"0lh8I10KGaQ"},{"n":10,"pathwright_id":339715101,"type":"read","label":"Dive Deeper","heading":"The Power and Potential of Sport","body":"Game on for Faith: Why Sport Matters to the Church\n\nLet's talk about sports! We love sports, right? You’re not alone! In almost every city, and maybe yours too, more people participate in sports or fitness activities than attend church. Should this make us sad?\n\nYes, but there is hope!\n\nSport: A Powerful Language\n\nHere's the exciting part: sports offer a massive opportunity for the church. The church isn't anti-sports; it celebrates the positive values of sportsmanship like teamwork, perseverance, and respect. These values align beautifully with the Bible!\n\nNelson Mandela famously said, \"Sport has the power to change the world.\" He saw how sports:\n\nMove people: Sports inspire and motivate, bringing people together with passion and fun.\nBreak down barriers: Language isn't a hurdle! Two teams can play soccer even if they speak different languages. Sports connect people across cultures, like during the World Cup or when welcoming refugees.\nBring hope: From young players getting better to chasing personal bests, sports offer hope for a brighter future. In a world that often feels hopeless, this is powerful!\n\nJust imagine the potential: Jesus's message of hope communicated through the world of sports!\n\nThe Power is in the Numbers\n\nLook at this graph! It shows how massive sports are compared to church attendance. Twice as many people are involved in sports in some way, whether playing, watching, coaching, or even just following sports news. Sports are a global language, understood and valued by billions of people.\n\nInternet users = 4.4 billion (statista.com)\nSmartphones = 2.5 billion (statista.com)\nChurch = 2.4 billion (Wikipedia)\nSports interest = 4.7 billion (number of people who watched 2008 Games - Nielsen Media Research)\n\nThe Call to Action\n\nLet's harness the power of sports! This session is just the beginning. Join us to explore how we can use our love for sports to share faith and inspire hope in our communities.\n\nAs Nelson Mandela said, “Sport has the power to change the world. It has the power to inspire. It has the power to unite people as little else can. It speaks to people in a language they can understand. Sport can create hope where there was once only despair. It is more powerful than governments at breaking down racial barriers.”","youtube":null},{"n":11,"pathwright_id":339715102,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"R5AkCw1HThg"},{"n":12,"pathwright_id":346256791,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"VpPXZlslG0E"},{"n":13,"pathwright_id":339715103,"type":"todo","label":"Live it Out","heading":"Live it out Application","body":"What idea from Nelson Mandela stood out to you?\nWho could help you think about connecting sport and faith?\n\nHelpful Links:\n\nhttps://www.readysetgo.world/en/resource/whatwedo\n\nhttps://www.readysetgo.world/en/resource/wherewedoit\n\nhttps://www.readysetgo.world/en/resource/howwedoit","youtube":null}]},{"n":3,"title":"How the Sport Movement Operates","steps":[{"n":14,"pathwright_id":339715105,"type":"todo","label":"Reflection Questions","heading":"Reflection Questions","body":"What social movements are you aware of?\n\nOthers have said:\n\nAction for Climate Change; Make Poverty History; Black Lives Matter; Clean-up Day; Earth First Movement; Free Software movement; Me Too movement; Women Against War movement.","youtube":null},{"n":15,"pathwright_id":339715106,"type":"read","label":"Intro to the Topic","heading":"Introduction","body":"There are many social movements across the world - like all the ones above. You might already be part of one because it aligns with your values. You can belong to a movement in many different ways, depending on your skills and opportunities.\n\nThink for a moment about the Church. Not just your local gathering or denomination, but the whole worldwide body. It’s huge. It’s diverse. It’s on the move!\n\nFind out how the sport movement relates to the church.","youtube":null},{"n":16,"pathwright_id":339715107,"type":"watch","label":"The Teaching Video","heading":"How the Sport Movement Operates","body":"","youtube":"e5QJiBc1Mhg"},{"n":17,"pathwright_id":339715108,"type":"read","label":"Dive Deeper","heading":"How the Sport Movement Operates","body":"The Way We Serve\n\nImagine a massive group of people from all walks of life united by a powerful goal. This is the global church, also called the \"body of Christ\" in the Bible. It connects cultures, languages, and even sports! This dynamic movement is focused on living out God's plan here on earth.\n\nThe Sport Movement Culture: Serving Actively Together\n\nWithin the global church, there's a vibrant movement focused on sharing Jesus' love through sports. This is the sport movement! But what is the foundation of the culture of this movement?\n\nEvery team has a culture, and the sports movement is no different. This culture shapes how we work together. We want a culture that honors God and reflects our beliefs! The culture of the sport movement can be summed up in three words: serve actively together!\n\nWhether we’re on or off the field, we want to play and train in a way that is consistent with what we believe – to serve Jesus, his church, and the broader community together actively.\n\nFive Keys to Serving Together in Sports\n\nHere are five essential things to keep in mind as we serve in the sports movement:\n\nKingdom Focus: We're ultimately serving God's Kingdom, following the teachings of Jesus. Jesus prayed, ‘God, your Kingdom come.’ How are we inviting God’s Kingdom into our sport?\nCharacter Counts: Living with virtues that honor God and align with the Bible is essential. We must grow in character and admit when we have done wrong.\nFaithful Leadership: Leaders who serve with integrity and humility are crucial. Jesus modeled servant leadership for us.\nRelationships First: Strong relationships matter more than programs or procedures. How can we build trusting and effective relationships?\nPartnering for Impact: Working together might be challenging, but it's vital for achieving God's mission (the Great Commission). It is too big for any one person, organization, or group.\n\nPutting It Into Action\n\nKnowing these ideas is just the first step. We need to actively grow in these areas. Reflect on where you can improve with the help of the Holy Spirit. Seek a supportive community and mentors to guide you on this journey.\n\nThis session was just your launchpad! Join us as we explore how your love for sports can be a powerful tool for serving Jesus and making a difference in the world.","youtube":null},{"n":18,"pathwright_id":339715109,"type":"watch","label":"The Work of the Sport Movement","heading":"The Work of the Sport Movement","body":"","youtube":"kGqlTXOoo60"},{"n":19,"pathwright_id":339715110,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"e3Fif-fv5kE"},{"n":20,"pathwright_id":343426497,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"z4vzpcA_CHI"},{"n":21,"pathwright_id":339715111,"type":"todo","label":"Live it Out","heading":"Live it Out Application","body":"What do you already know about the sport movement?\nHow have you seen the people of the sport movement reflect these 5 areas above?\nWhat would be the impact around the world if God’s people reflect these 5 aspects above?\n\nReady Set Go Website\n\nReady Set Go YouTube Channel","youtube":null}]},{"n":4,"title":"How Can ReadySetGo Help a Sport Person","steps":[{"n":22,"pathwright_id":339715113,"type":"todo","label":"Reflection Questions","heading":"Reflection Questions","body":"How do you see your faith and love of sport connect? How deeply have you thought about this?\n\nOthers have said:\n\nI feel God’s pleasure when I run or move in some way; I come alive when I share my faith with others on my team; As a chaplain; I can help people know they are important and valuable; I see life as a marathon race; the Bible helps me have wisdom to live life better -especially as I play sport; God sends the waves I surf on.","youtube":null},{"n":23,"pathwright_id":339715114,"type":"read","label":"Intro to the Topic","heading":"Introduction","body":"You love sports! You follow Jesus. Many people do! But let’s dig into this a little deeper. Here's a powerful way to see sports through the lens of faith: Sports can be both worship and a mission field.","youtube":null},{"n":24,"pathwright_id":339715115,"type":"watch","label":"The Teaching Video","heading":"How Can ReadySetGo Help a Sport Person","body":"","youtube":"WCoSSVgGFEM"},{"n":25,"pathwright_id":339715116,"type":"read","label":"Dive Deeper","heading":"How Can ReadySetGo Help a Sportsperson","body":"Game On for God: Your Faith on the Field\n\nSports: A Way to Worship God\n\nSport can be your worship to God in the same way singers sing, musicians play, and preachers preach - to honor God. So, let’s see this worship through the lens of the Gospel.\n\nWe Were Made to Praise God: The Bible tells us we were created in God’s image to worship God (Genesis 1 & 2). The sport was invented as creative play to be enjoyed. Everything in our lives is an act of worship to God. When we play sports with good sportsmanship and joy, we honor Him and use the talents He gave us. We were originally designed for this very thing.\nSin in the Game: But we know life can be ugly and frustrating. Sin causes us to focus on ourselves instead of God (Genesis 3). We want to make our own decisions about what is right and live life our own way, apart from God. This causes greed, fights, immorality, and war. Sin is part of sports, too. We might play for our own glory, cheat, or become frustrated and ruin the game for others. Sin has very negative consequences in the world of sport.\nRestored Worship: The good news is that God sent Jesus to forgive our sins and restore our relationship with Him and with others (Romans 12). Now, we can play sports and offer our skills and relationships to Him! Every game, team training, and coach talk becomes an opportunity to worship God with everything we have and honor others.\n\nSport: A Mission Field\n\nSports can also be a powerful mission field:\n\nGlobal Reach: Billions of people around the world love sports! This is a huge opportunity because many haven’t heard the good news of Jesus.\nBridging Gaps: Sports can connect people from different backgrounds whom you might not otherwise meet. You have an opportunity to get alongside different people regularly and be salt and light.\nSharing the Message: Sports can help us share the good news of Jesus with others. It is also an opportunity to learn new skills in conversation, Bible handling, asking questions, and praying strategically.\n\"Go and make disciples\" (Matthew 28:18-20) applies to sports, too. Imagine the impact! You are uniquely positioned to share your faith with your teammates, coaches, and others you meet through sports.\n\nJoin the Game!\n\nThink about your gym, team training sessions, or competitions. Who might be receptive to the Good News of Jesus? Who longs for something deeper? Who needs encouragement? Start praying for your team and see what doors God opens!\n\nJoin us to explore how your love for sports can be a powerful context for worshiping God and sharing your faith with others.","youtube":null},{"n":26,"pathwright_id":339715117,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"9cswmM6UyIk"},{"n":27,"pathwright_id":339715118,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"vKiYnt20n9I"},{"n":28,"pathwright_id":339715119,"type":"todo","label":"Live it Out","heading":"Live it Out Application","body":"Who are the other sports people you know who believe in Jesus?\nHow can you connect with them regularly to encourage and support them? Could you pray together for others on your team?\nWhen you play sport next, consider it worship. What did you notice? What happened?\nFind Pray|Play |Say|Together as a resource. See videos.\n\nReady Set Go Website\n\nReady Set Go YouTube Channel","youtube":null}]},{"n":5,"title":"How Can ReadySetGo Help a Local Church","steps":[{"n":29,"pathwright_id":339715121,"type":"todo","label":"Reflection Questions","heading":"Reflection Questions","body":"How is the Great Commission being implement in your local area through your church?\n\nOthers have said:\n\nA soup kitchen feeds the poor; we run outreaches; holiday clubs for kids; Alpha courses; we have a basketball court for youth in the church grounds; we run craft and games groups; family movie nights; good preaching.\n\nWhat are the challenges?\n\nOthers have said:\n\nGetting enough volunteers; money; people are unwilling to Go outside the church; many don’t have the skills or confidence to make disciples; people are too busy; not many men volunteer to help.","youtube":null},{"n":30,"pathwright_id":339715122,"type":"read","label":"Intro to the Topic","heading":"Introduction","body":"Pastors are very passionate about proclaiming the gospel, making disciples of Jesus, developing leaders, and teaching the Bible well. As a pastor, you want your church community to be alive and growing in their faith. But this is not always the reality. Sometimes, as leaders, we need new ideas and encouragement. Where do you need fresh input and new ideas to make disciples?","youtube":null},{"n":31,"pathwright_id":339715123,"type":"watch","label":"The Teaching Video","heading":"How Can ReadySetGo Help a Local Church","body":"","youtube":"TveX6YJLsVo"},{"n":32,"pathwright_id":339715124,"type":"watch","label":"VUCA World","heading":"VUCA World","body":"","youtube":"q023As9l6O8"},{"n":33,"pathwright_id":339715125,"type":"read","label":"Dive Deeper","heading":"How Can ReadySetGo Help a Local Church","body":"Reimagine Ministry: Sports as a Game Changer\n\nAs a pastor, you're passionate about sharing faith, developing leaders, and engaging your community with the Bible. But have you considered using sports to achieve these goals?\n\nFresh Ideas for Your Ministry\n\nMinistry in today's world can be challenging. Issues like broken families, lack of leadership, and a feeling of disconnection plague many communities. This is a VUCA world—it is volatile, uncertain, complex, and ambiguous. The sports ministry can be a game changer in helping the church move outside its four walls and try new strategies to make disciples!\n\nSport: A Bridge to Your Community\n\nSports offer a powerful way to connect with people facing these challenges. Here's how:\n\nBuilding Leaders: Sports naturally develop leadership skills, something your church can nurture.\nFighting Boredom: Sports offer a healthy and engaging outlet for young people. It can be a natural part of any children’s, youth, or adult program.\nBuilding Community: Sports teams foster a sense of belonging and connection. Sport can help refocus the church community on how to operate in teams and serve the greater goal.\n\nJoin the Movement\n\nAs we've seen, sports provide a powerful platform for making disciples. Could the sport movement offer some hope to your local church community? Here are some ways you can get involved and find out more:\n\nExperience the Power of sport: Attend a sports ministry event like a KidsGames, a camp, or a competition. See firsthand how sports can connect with your community.\nEmpower Your Athletes: Gather sportspeople from your church. Pray together and explore how they can be disciples of Jesus and share their faith through sports opportunities.\nExplore Resources: ReadySetGo offers resources to equip your church to reach your community through sports. See website links.\nConnect with Others: Talk to fellow pastors! Learn about their experiences with sports ministry and how it's impacted their churches.\n\nThe Game Has Begun!\n\nSports ministry is a dynamic way to reach your community, share faith, and build a stronger church. This session is just the kickoff. Join us to explore how sports can transform your ministry!","youtube":null},{"n":34,"pathwright_id":339715126,"type":"todo","label":"Dig into the Bible","heading":"Dig into the Bible","body":"Read Ephesians 1:22-23 a number of times.\n\n\"And God placed all things under his (Jesus) feet and appointed him to be head over everything for the church, which is his body, the fullness of him who fills everything in every way.\"\n\nThink about these questions after reading the Scripture:\n\nWhat did you learn about God?\n\nWhat did you learn about humanity?\n\nWhat are the promises? What are the commands?\n\nWhat will you do about it?","youtube":null},{"n":35,"pathwright_id":339715127,"type":"watch","label":"I am Involved","heading":"I am Involved","body":"","youtube":"jEDWnLQbFfU"},{"n":36,"pathwright_id":339715130,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"4D3r_-06BB4"},{"n":37,"pathwright_id":343426671,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"A4K7lVxu9LQ"},{"n":38,"pathwright_id":339715131,"type":"todo","label":"Live it Out","heading":"Live it Out Application","body":"How could you encourage and release the sports people in your local church to make disciples?\nCould health and fitness help your people be healthier and more effective in their ministry?\n\nReady Set Go Website\n\nReady Set Go YouTube Channel","youtube":null}]},{"n":6,"title":"Go Strategies Overview","steps":[{"n":39,"pathwright_id":339715135,"type":"todo","label":"Reflection Questions","heading":"Reflection Questions","body":"What part of the sport world do you currently enjoy and play or compete in?\n\nWhat do you love about it?","youtube":null},{"n":40,"pathwright_id":339715137,"type":"read","label":"Intro to the Topic","heading":"Introduction","body":"The sport movement has many practical tools to help you get started in your local community. There are Online courses, programs, starter packs, and videos. The tools are designed for the people the strategies will serve – kids, coaches, leaders, or players. Find out more about the groups of people focused on different areas of sport.","youtube":null},{"n":41,"pathwright_id":339715138,"type":"watch","label":"The Teaching Video","heading":"Go Strategies Overview","body":"","youtube":"oLP1X95URhM"},{"n":42,"pathwright_id":339715139,"type":"read","label":"Dive Deeper","heading":"Go Strategies Overview","body":"Unleash Your Passion: Sharing Faith Through Sport\n\nYour Zone, Your Passion:\n\nThe Sports Movement celebrates all areas of sports: competitive athletes, fitness enthusiasts, casual gamers, skateboarders… you name it! What’s your zone – the part of the sports world where you thrive?\n\nBut the world of sports is vast! Here’s how we start to make sense of it.\n\nCompetitive Sports: Are you a high-level athlete or a fierce competitor in any sport?\nPlay and Leisure: Does connecting with others through games bring you joy?\nFitness: Are you passionate about fitness, health, and well-being?\nAction Sports: Do you thrive on the challenge and excitement of extreme sports like rock climbing or surfing?\nAll Ability Sports: Do you believe everyone deserves the opportunity to participate in sports, no matter what their disabilities are?\nEsports (Gaming): Do you compete in the online gaming world?\n\nFaith in the Game\n\nAs you engage in your zone of sport, have you ever wondered how your faith connects with it? Do you desire to share your faith with others in this world? The Sports Movement is here to help!\n\nStrategies for Everyone\n\nPeople around the world have developed incredible GO strategies – practical ways to live out your faith within your specific sports area. Here's a breakdown:\n\nGO Sport: This strategy equips you to reach out to athletes and sportspeople who take sport seriously and connect with them through their passion for sports. This includes strategies like sportsonline.training, chaplaincy, sports camps, and Whole Life Coaching.\nGOPlay: This strategy focuses on using the power of games and playful activities to connect with everyone in your community and share your faith. This includes strategies like KidsGames, Family on Mission, play camps, and festivals.\nGOFitness: This strategy equips you to reach out to people in the fitness world and connect with them about their health and wellness goals. It can happen in gyms, parks, and online.\nGOAction: This strategy offers tools to engage with those in extreme or freestyle sports cultures, understanding their unique perspective. We have a unique perspective, language, and culture within the sport.\nGOAll-Ability: This strategy equips you to connect with people with disabilities, using sports as a bridge to share your faith.\nGOGame: This strategy helps you navigate the world of online gaming, fostering connections and sharing faith within that sphere.\n\nAll six areas overlap and work in unity with one another.\n\nFind Your Place\n\nEach GO strategy is designed to empower you in your specific sports zone. Go to your zone of the sport movement with people with the same passion. It might be fitness or kids. You could be interested most in highly competitive sports or surfing. There’s something for you.\n\nJoin the Movement\n\nDon't let your love of sports and your faith live in separate worlds. Let's use them together to connect with others and share the message of Christ! Are you ready to explore your faith through sports? Visit our website to discover which GO strategy best aligns with your passion! We have resources, tools, and a supportive community to help you make a difference.","youtube":null},{"n":43,"pathwright_id":339715140,"type":"todo","label":"Dig into the Bible","heading":"Dig into the Bible","body":"Read Acts 17:28 a number of times.\n\n\"For in Him (Jesus) we live and move and have our being.\"\n\nThink about these questions after reading the Scripture:\n\nWhat did you learn about God?\n\nWhat did you learn about humanity?\n\nWhat are the promises? What are the commands?\n\nWhat will you do about it?","youtube":null},{"n":44,"pathwright_id":339715141,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"jTUbUUoIBB0"},{"n":45,"pathwright_id":339715142,"type":"todo","label":"Live it Out","heading":"Live it Out Application","body":"Which of these six categories best describes you?\nWhat do you currently do to live out your faith in this area of sport?\nWhat can you do to connect with other believers who love this area of sport?\n\nReady Set Go Website\n\nReady Set Go YouTube Channel","youtube":null}]},{"n":7,"title":"The History of the Sport Movement","steps":[{"n":46,"pathwright_id":339715144,"type":"todo","label":"Reflection Questions","heading":"Reflection Questions","body":"When did you become aware that sport and faith can coexist?\n\nWhat sports ministry are you aware of in your city?","youtube":null},{"n":47,"pathwright_id":339715145,"type":"watch","label":"The Teaching Video","heading":"The History of the Sport Movement","body":"","youtube":"tz0srZW-fCs"},{"n":48,"pathwright_id":339715146,"type":"read","label":"Dive Deeper","heading":"The History of the Sport Movement","body":"Early Connections (1st-19th Century):\n\nThe 1st-century writings of Apostle Paul establish an early link between faith and sports, using sports metaphors and principles to illustrate Christian life. 1 Corinthians 9:24-27: Paul compares the Christian life to a race (v. 24). We must train with discipline (v. 25) to win the prize (v. 24). Philippians 3:12-14: Here, the metaphor is running a race again (v. 13). We must keep pressing on (v. 13) and forget the past (v. 13) to reach the goal (v. 14).\nAfter a significant gap, the concept resurfaces in the mid-19th century, with a movement combining faith, social service, and sports, influencing prominent UK football clubs. Organizations like the YMCA further emphasized this connection, even creating basketball for Christian ministry.\n\n20th Century: Fluctuations and Renewal\n\nThe early 20th century saw a decline in sports ministry prominence despite inspiring Christian athletes like Eric Liddell.\nFollowing World War II, the concept re-emerged in the US and a few other countries but remained largely unknown globally.\n\nThe Modern Movement Takes Shape (1960s-Present):\n\n1969 marks a turning point with a global initiative to equip churches and leaders for sports ministry, aiming to reach every nation and city with the Christian message through sports.\nThe 1960s also saw the rise of sports chaplaincy, providing spiritual support to high-level athletes.\nThe following decades witnessed steady growth, with sports ministry initiatives taking root in various regions, such as Europe, Asia, Africa, and the Pacific.\nA significant gathering in Hong Kong in 1982 facilitated international collaboration and the spread of sports ministry to new countries.\nThe 1988 Summer Olympics marked the beginning of outreach efforts around major sporting events, a trend that continued and expanded.\n\n21st Century: Expansion and Refinement\n\nThe new millennium saw the birth of \"KidsGames\" (later \"Global Community Games\") in Egypt, a program utilizing sports to engage children and teenagers, which rapidly spread worldwide.\nA 2003 gathering in Athens marked a crucial turning point. It identified ten key areas of sports ministry, fostering collaboration, and established a system for assisting new countries by leveraging expertise from established ministries in each region.\nSince then, the movement has experienced significant geographical and practical growth. Numerous training methods and resources have been developed, impacting millions globally. By 2015, \"ReadySetGO\" marked a shift towards further simplification and broader reach.\nAs of 2019, the movement continues to evolve, launching new resources and strategies to ensure global accessibility. The current focus rests on six key priorities: reaching all populations and locations, mobilizing prayer and leadership development, fostering teamwork, and engaging every church in sports ministry and church development.\n\nEnduring Principles and Ongoing Growth:\n\nThe movement remains committed to its core principles of servant-hearted leadership and collaborative teamwork. While strategies and methods have diversified, the fundamental goal of using sports to spread the Christian faith and make disciples remains constant. The document concludes by highlighting the movement's remarkable global presence, with countless stories of individuals and communities utilizing sports ministry to make a positive impact.","youtube":null},{"n":49,"pathwright_id":339715148,"type":"todo","label":"Dig into the Bible","heading":"Dig into the Bible","body":"Read Acts 17:26-27 a number of times.\n\n\"From one man he made all the nations, that they should inhabit the whole earth; and he marked out their appointed times in history and the boundaries of their lands. God did this so that they would seek him and perhaps reach out for him and find him, though he is not far from any one of us.\"\n\nThink about these questions after reading the Scripture:\n\nWhat did you learn about God?\n\nWhat did you learn about humanity?\n\nWhat are the promises? What are the commands?\n\nWhat will you do about it?","youtube":null},{"n":50,"pathwright_id":339715150,"type":"watch","label":"Case Study","heading":"Case Study","body":"","youtube":"mgjM7WmO6lQ"}]},{"n":8,"title":"Call to Action","steps":[{"n":51,"pathwright_id":339731715,"type":"watch","label":"The Teaching Video","heading":"Call to Action","body":"","youtube":"M0xG-Zova3Y"},{"n":52,"pathwright_id":339715153,"type":"read","label":"So, What Will You do Next?","heading":"Call to Action","body":"So, What Will You do Next?\n\nIf you love Jesus and sport, you’re already part of this global sport movement. You’re part of a community that loves sport and loves Jesus. It’s a grassroots movement.\n\nBring sport and faith together. Don't let your love of sports and your faith live in separate worlds. Let's use them together to connect with others and share the message of Christ! Let's get out there and make a difference!\n\nYou can find resources to help you get started. All the resources are free, so you can explore them and find tools and ideas that might be helpful to you.\n\nIt's a movement for everyone, regardless of your background. So, are you ready to use your passion for sports to make a difference? ReadySetGO can help you turn your love of the game into a powerful tool for sharing hope and inspiring others.\n\nThere are many practical things you can do next!\n\nBe curious and connect. Start to be curious about what’s going on with sport and faith in your community. Who else loves Jesus and loves sport? Have a coffee with them? Connect!\nPrayer at 9:38. Start praying. Ask God to give you a heart for making disciples. Pray with others all around the world who are following the words of Jesus in Matthew 9:38, “Ask the Lord of the harvest, therefore, to send out workers into his harvest field.” Set your alarm to 9:38 and pray this scripture.\nContinue to learn more. Keep going with the online. Develop as a leader. Readysetgo.training has many courses to help you grow as a leader and multiply your impact. Go to readysetgo.training\nJoin a face-to-face training to be equipped. ReadySetGO trainings and Multiply schools happen all over the world regularly.\nConnect with others in your region or language. Who is already doing sport movement strategies? You can learn a lot from others.\nVisit the website to learn more. Explore the GO strategies and join a community of like-minded believers who are using sports to change the world. Together, let's use the language of sports to ignite hope and share the love of Christ!","youtube":null},{"n":53,"pathwright_id":339715155,"type":"todo","label":"Live it Out","heading":"Live it Out Application","body":"Reflect – spend some time with the Lord and reflect upon what you learned and took away from these sessions. What is the Lord saying to you? Can you reflect on this with someone who can help you process it all?\nRespond – here are a few options that may provide an opportunity for you to respond to what the Lord may be saying to you or doing in your heart.\nGet connected! Click this link. readysetgo.world\nLook and listen: can sport be a solution to reaching people in your community? Are there other people from your church who may be interested in learning more along with you? Consider inviting 4-5 people to explore executing a GOStrategy or going through further training.\n\nReady Set Go Website\n\nReady Set Go YouTube Channel","youtube":null}]}]};

  if (rd) { const pid = rd.dataset.read; S.reads[pid] = Math.min(3, (S.reads[pid] || 0) + 1); save(); const n = S.reads[pid];
    rd.querySelectorAll('.reads i').forEach((i, k) => i.classList.toggle('on', k < n)); rd.querySelector('.reads span').textContent = n >= 3 ? 'Three reads done' : 'Reads';
    rd.setAttribute('aria-label', `Mark a read. ${n} of 3 done.`); n >= 3 ? whistle(.3) : tone(520 + n * 120, .1, 'sine', .06); buzz(15); return; }
  const lk = t.closest('[data-lock]');
  if (lk) { const k = lk.dataset.lock; S.locks[k] = !S.locks[k]; save(); const on = S.locks[k], card = lk.closest('.commit'); card.classList.toggle('locked', on); lk.setAttribute('aria-pressed', on);
    const word = card.closest('#stepBody') && SESS[cur.si].steps[cur.i].kind === 'whistle' ? (on ? 'I’m on it' : 'I’ll do this') : (on ? 'Locked in' : 'Lock it in');
    lk.innerHTML = ico(on ? 'check' : 'lock', 'icon', 2.6) + word; if (on) { pop(); buzz(20); } return; }
  const wr = t.closest('[data-write]');
  if (wr) { const ta = wr.closest('.commit').querySelector('textarea'); ta.hidden = !ta.hidden; wr.setAttribute('aria-expanded', !ta.hidden); if (!ta.hidden) { ta.focus(); ta.style.height = Math.max(ta.scrollHeight, 70) + 'px'; } return; }
  const mh = t.closest('[data-memohide]');
  if (mh) { const box = mh.closest('.memo'); const ws = [...box.querySelectorAll('.w:not(.hid)')]; if (!ws.length) return; const n = Math.max(1, Math.ceil(ws.length / 3)); for (let i = 0; i < n; i++) { const w = ws.splice((Math.random() * ws.length) | 0, 1)[0]; w.classList.add('hid'); } tone(500, .06, 'sine', .05); return; }
  const mr = t.closest('[data-memoreset]');
  if (mr) { mr.closest('.memo').querySelectorAll('.w').forEach(w => w.classList.remove('hid')); return; }
  const w = t.closest('.memo .w');
  if (w) { w.classList.toggle('hid'); return; }
});
document.addEventListener('keydown', e => { const w = e.target.closest && e.target.closest('.memo .w'); if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); w.classList.toggle('hid'); } });

/* ---------- session complete ---------- */
function renderDone(si) {
  const s = SESS[si], m = META[si], v = $('#v-done'); v.style.setProperty('--accent', m.c);
  const all = sessionsDone() === SESS.length, nxt = nextSession();
  v.innerHTML = `<div class="medal"><div class="ribbon"></div><div class="disc"><b>${all ? '★' : si + 1}</b></div></div>
    <span class="tape" style="margin-bottom:14px">${all ? 'Season complete' : 'Session complete'}</span>
    <h1>${all ? 'You ran the whole race' : esc(s.title)}</h1>
    <p class="sub">${all ? 'All eight sessions done. Your answers and game plans are waiting in your playbook.' : `Session ${si + 1} done. ${8 - sessionsDone()} to go.`}</p>
    <div class="stats"><div><b>${s.steps.length}</b><span>Steps done</span></div><div><b>${sessionsDone()}/8</b><span>Sessions</span></div></div>
    <div class="done-acts">${nxt !== null ? `<button class="btn" type="button" data-open="${nxt}:${firstOpenStep(nxt)}">Session ${nxt + 1}: ${esc(SESS[nxt].title)}</button>` : `<button class="btn" type="button" data-tab="book">Open my playbook</button>`}
    <button class="btn ghost" type="button" data-tab="home">Back to the season</button></div>`;
  if (!S.seenDone[si]) { S.seenDone[si] = true; save(); }
  setTimeout(() => { confetti([m.c, '#ffffff', '#ffb81c', '#2fd66a']); whistle(.35); setTimeout(() => whistle(.25), 420); buzz([40, 60, 40]); }, 250);
}
function confetti(cols) {
  if (reduced) return; const cv = $('#fx'), ph = $('#phone'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = ph.clientWidth * dpr; cv.height = ph.clientHeight * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = ph.clientWidth, H = ph.clientHeight, parts = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 60, y: H * .32, vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0] }));
  let t0 = performance.now();
  (function f(t) { const k = (t - t0) / 1000; g.clearRect(0, 0, W, H);
    for (const p of parts) { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - k / 2.6); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); g.restore(); }
    if (k < 2.6) requestAnimationFrame(f); else g.clearRect(0, 0, W, H); })(t0);
}

/* ---------- playbook (journal) ---------- */
function questionFor(key) {
  const [pid, idx] = key.split(':'); const st = ALL.find(x => String(x.pathwright_id) === pid); if (!st) return null;
  if (st.kind === 'warmup') { const qs = blocks(st.body).flat().filter((l, i, a) => !/^Others have said/i.test(l) && !/^Others have said/i.test(a[i - 1] || '')); return { st, q: qs[+idx] }; }
  if (st.kind === 'training') { const qs = blocks(st.body).flat().filter(l => /\?$/.test(l)); const ref = (blocks(st.body).flat().find(l => /^Read /.test(l)) || '').replace(/^Read (.+?) a number of times\.?$/, '$1'); return { st, q: `${ref} · ${qs[+idx]}` }; }
  if (idx && idx[0] === 'c') { const ls = blocks(st.body).flat().filter(l => !/^Helpful Links/i.test(l) && !/^Ready Set Go (Website|YouTube)/i.test(l) && !/^https?:/.test(l) && !isQuote(l));
    const clean = []; for (let i = 0; i < ls.length; i++) { if (/^Memorize this scripture/i.test(ls[i])) continue; clean.push(ls[i]); }
    if (st.kind === 'whistle') { const b = blocks(st.body).find(x => x.length > 1) || []; const l = b[+idx.slice(1)] || ''; return { st, q: l.split('. ')[0] }; }
    return { st, q: clean[+idx.slice(1)] }; }
  return { st, q: '' };
}
function renderBook() {
  const groups = SESS.map((s, si) => {
    const items = [];
    s.steps.forEach(st => {
      Object.keys(S.ans).filter(k => k.startsWith(st.pathwright_id + ':') && S.ans[k].trim()).forEach(k => { const q = questionFor(k); items.push({ q: q && q.q, a: S.ans[k] }); });
      Object.keys(S.locks).filter(k => k.startsWith(st.pathwright_id + ':') && S.locks[k] && !(S.ans[k] || '').trim()).forEach(k => { const q = questionFor(k); items.push({ q: 'Locked in', a: q && q.q }); });
    });
    if (si === 5 && S.zone) items.unshift({ q: 'My zone', a: `${S.zone} → ${ZONE_TO[S.zone]}` });
    return { s, si, items };
  }).filter(g => g.items.length);
  const sc = $('#bookScroll');
  sc.innerHTML = `<div class="page-h"><h1>My playbook</h1><p>Everything you write in warm-ups, training and game plans lands here.${storageOK ? ' It stays on this device.' : ' This browser is blocking storage, so it will clear when you close the page.'}</p></div>` +
    (groups.length ? groups.map(g => `<div class="jgroup" style="--accent:${META[g.si].c}"><h2><i>${g.si + 1}</i>${esc(g.s.title)}</h2>${g.items.map(it => `<div class="jitem"><div class="jq">${esc(it.q || '')}</div><div class="ja">${esc(it.a || '')}</div></div>`).join('')}</div>`).join('') +
      `<div class="page-acts"><button class="btn" type="button" id="copyAll">${ico('copy')}Copy my playbook</button></div>`
      : `<div class="empty"><b>Nothing here yet</b><p>Answer a warm-up question or lock in a game plan and it shows up here, sorted by session.</p><button class="btn" type="button" style="margin-top:16px" data-tab="home">Go to the season</button></div>`);
  const cb = $('#copyAll');
  if (cb) cb.addEventListener('click', () => {
    const txt = 'Ready: Vision · My playbook\n\n' + groups.map(g => `Session ${g.si + 1}: ${g.s.title}\n` + g.items.map(it => `- ${it.q}\n  ${String(it.a).replace(/\n/g, '\n  ')}`).join('\n')).join('\n\n');
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? 'Playbook copied' : 'Copy blocked here'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Playbook copied'), fallback); } catch (e) { fallback(); }
  });
}

/* ---------- about ---------- */
function renderAbout() {
  const paras = COURSE.about.split('\n').map(l => l.trim()).filter(l => l && !/^\d\./.test(l) && !/^Here are the topics/i.test(l));
  $('#aboutScroll').innerHTML = `<div class="page-h"><h1>About</h1></div><div class="about-body"><div class="prose">${paras.map((p, i) => `<p class="${i === 0 ? 'lead' : ''}">${esc(p)}</p>`).join('')}</div>
    <ol class="topics">${SESS.map((s, i) => `<li style="--c:${META[i].c}"><i>${i + 1}</i>${esc(s.title)}</li>`).join('')}</ol>
    <div class="links"><a href="${LINKS.site}" target="_blank" rel="noopener"><span>ReadySetGo website<small>readysetgo.world</small></span>${ico('ext')}</a>
    <a href="${LINKS.yt}" target="_blank" rel="noopener"><span>ReadySetGo on YouTube<small>All the course videos</small></span>${ico('ext')}</a></div>
    <div class="eyebrow" style="margin-top:28px">Your progress</div>
    <p class="hint">${Object.keys(S.done).length} of ${ALL.length} steps · saved on this device only.</p>
    <div id="resetBox"><button class="btn ghost" type="button" id="resetBtn" style="margin-top:12px">Start over</button></div>
    <p class="credit">Content from the ReadySetGo course “Ready: Vision”. Videos play from the ReadySetGo YouTube channel. Scripture quotations as in the original course.</p></div>`;
  $('#resetBtn').addEventListener('click', () => {
    $('#resetBox').innerHTML = `<div class="confirm"><p>This clears your progress, answers and game plans on this device. It can’t be undone.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="button" id="resetYes" style="background:var(--ready);color:#fff">Clear everything</button><button class="btn ghost" type="button" id="resetNo">Keep my progress</button></div></div>`;
    $('#resetNo').addEventListener('click', renderAbout);
    $('#resetYes').addEventListener('click', () => { const snd = S.sound; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, { done: {}, xp: 0, ans: {}, others: {}, react: {}, reads: {}, locks: {}, plays: {}, bonus: {}, zone: null, sound: snd, started: false, last: null, seenDone: {} }); save(); paintTitle(); show('title'); });
  });
}

/* ---------- boot ---------- */
document.documentElement.style.setProperty('--sil', `url("${document.querySelector('.team img').src}")`);
paintTitle(); paintSound(); paintXP();
show('title');
})();
