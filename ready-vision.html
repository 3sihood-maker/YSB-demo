<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready: Vision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap">
<style>
/* Layout: the YSB demo phone — dark stage, one 390×844 phone, full-bleed on real phones.
   Inside: starting-lights title → 8 backlit-silhouette session cards → one step per screen with a race-track progress bar. */
:root {
  color-scheme: dark;
  --stage: #0d0f12;      /* desktop surround (YSB stage) */
  --app: #090b0d;        /* phone background */
  --surface: #14181c;    /* cards */
  --surface2: #1c2127;   /* raised / inputs */
  --line: #2a3138;       /* hairlines */
  --ink: #f4f6f2;        /* main text */
  --muted: #98a2a4;      /* secondary text */
  --ready: #ff453a;      /* ReadySetGo red triangle */
  --set: #ffd60a;        /* ReadySetGo yellow triangle */
  --go: #30d158;         /* ReadySetGo green triangle */
  --sky: #27a3ff;        /* YSB speed-burst blue */
  --track: #b9472c;      /* running-track rubber */
  --paper: #f3efe4;      /* torn paper */
  --paper-ink: #15181b;
  --accent: var(--go);   /* set per session */
  --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --marker: "Permanent Marker", "Comic Sans MS", "Chalkboard SE", cursive;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--stage); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- phone frame (as YSB demo) ---------- */
.stage { height: 100%; display: grid; place-items: center; }
.phone { position: relative; width: 100%; height: 100%; background: var(--app); overflow: hidden; isolation: isolate; }
@media (min-width: 520px) {
  .phone { width: 390px; height: min(844px, calc(100% - 32px)); border-radius: 46px; box-shadow: 0 0 0 10px #000, 0 0 0 11px #2b2d31, 0 30px 80px rgba(0,0,0,.6); }
}
@media (pointer: coarse) and (max-height: 520px) {
  .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
}
.view { position: absolute; inset: 0; display: flex; flex-direction: column; border-radius: inherit; overflow: hidden; }
.view.enter { animation: viewIn .38s cubic-bezier(.2,.8,.2,1) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.pad { padding: 0 20px; }

/* ---------- shared bits ---------- */
.rays { background:
  repeating-conic-gradient(from -90deg at 50% 120%, color-mix(in srgb, var(--accent) 55%, transparent) 0deg 1.6deg, transparent 1.6deg 6.5deg),
  radial-gradient(120% 90% at 50% 120%, color-mix(in srgb, var(--accent) 45%, #000) 0%, #07090b 70%); }
.grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.tape { display: inline-block; font: 400 15px/1 var(--marker); color: var(--paper-ink); background: var(--accent); padding: 7px 12px 6px; transform: rotate(-2.5deg); letter-spacing: .02em;
  clip-path: polygon(0 8%, 4% 0, 9% 6%, 15% 1%, 22% 7%, 30% 0, 38% 5%, 47% 0, 55% 6%, 63% 1%, 71% 6%, 79% 0, 87% 5%, 94% 0, 100% 7%, 98% 50%, 100% 93%, 95% 100%, 88% 94%, 80% 100%, 72% 95%, 63% 100%, 55% 94%, 46% 100%, 38% 95%, 29% 100%, 21% 94%, 13% 100%, 6% 95%, 0 100%, 2% 50%); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--accent); color: #07110a;
  font: 800 16px/1 var(--body); letter-spacing: .02em; text-transform: uppercase; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .15s; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--surface2); font: 700 12px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font: 800 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.icon { width: 20px; height: 20px; flex: none; }

/* ---------- title ---------- */
#v-title { background: #05070a; }
#burst { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-wrap { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; padding: calc(46px + env(safe-area-inset-top, 0px)) 22px 0; text-align: center; }
.rsg-logo { display: block; width: 190px; max-width: 60%; height: auto; margin-bottom: 4px; filter: drop-shadow(0 2px 10px rgba(0,0,0,.7)); }

.tagline span { white-space: nowrap; }
.lights { margin-top: 26px; line-height: 0; }
.tri { width: 128px; height: auto; overflow: visible; }
.tri .t { stroke: none; transition: fill .15s, filter .2s; transform-box: fill-box; transform-origin: 40% 50%; }
.tri .t.r { fill: color-mix(in srgb, var(--ready) 26%, #0b0d0f); }
.tri .t.a { fill: color-mix(in srgb, var(--set) 22%, #0b0d0f); }
.tri .t.g { fill: color-mix(in srgb, var(--go) 22%, #0b0d0f); }
.tri .t.on { animation: lightUp .45s cubic-bezier(.2,.9,.3,1.4); }
.tri .t.r.on { fill: var(--ready); filter: drop-shadow(0 0 5px var(--ready)) drop-shadow(0 0 16px var(--ready)) drop-shadow(0 0 34px color-mix(in srgb, var(--ready) 70%, transparent)); }
.tri .t.a.on { fill: var(--set); filter: drop-shadow(0 0 5px var(--set)) drop-shadow(0 0 16px var(--set)) drop-shadow(0 0 34px color-mix(in srgb, var(--set) 70%, transparent)); }
.tri .t.g.on { fill: var(--go); filter: drop-shadow(0 0 6px var(--go)) drop-shadow(0 0 18px var(--go)) drop-shadow(0 0 40px color-mix(in srgb, var(--go) 70%, transparent)); }
@keyframes lightUp { 0% { transform: scale(.92); } 55% { transform: scale(1.1); } 100% { transform: scale(1); } }
.lamp { width: 34px; height: 34px; border-radius: 50%; background: #1a1e22; box-shadow: inset 0 3px 6px rgba(0,0,0,.7); transition: background .12s, box-shadow .12s; }
.lamp.on.r { background: var(--ready); box-shadow: 0 0 24px var(--ready), inset 0 -4px 6px rgba(0,0,0,.25); }
.lamp.on.a { background: var(--set); box-shadow: 0 0 24px var(--set), inset 0 -4px 6px rgba(0,0,0,.25); }
.lamp.on.g { background: var(--go); box-shadow: 0 0 28px var(--go), inset 0 -4px 6px rgba(0,0,0,.25); }
.title-cta { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 24px; }
.title-cta .sub { font: 600 13px/1.3 var(--body); color: var(--muted); }
.team { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; height: 210px; pointer-events: none; }
/* a soft light behind the team that drifts side to side; the rim light follows it */
.team::before { content: ""; position: absolute; inset: -60px -10% 0; background:
  radial-gradient(48% 58% at 50% 100%, color-mix(in srgb, var(--go) 48%, transparent), transparent 72%),
  radial-gradient(80% 70% at 50% 100%, color-mix(in srgb, var(--sky) 22%, transparent), transparent 75%);
  animation: teamGlow 7s ease-in-out infinite alternate; }
@keyframes teamGlow { from { transform: translateX(-14%); opacity: .75; } to { transform: translateX(14%); opacity: .95; } }
/* rim light: a light copy of the silhouette, a few px off the black one, peeking out at the edges */
.team .rim { position: absolute; left: 50%; bottom: -4px; width: 118%; aspect-ratio: 1200 / 639; opacity: .45; filter: blur(.9px);
  background: linear-gradient(90deg, color-mix(in srgb, var(--go) 45%, #fff) 0%, color-mix(in srgb, var(--sky) 40%, #fff) 50%, color-mix(in srgb, var(--go) 45%, #fff) 100%);
  -webkit-mask: var(--sil) center bottom / 100% auto no-repeat; mask: var(--sil) center bottom / 100% auto no-repeat;
  transform: translateX(-50%); animation: teamRim 7s ease-in-out infinite alternate; }
@keyframes teamRim { from { transform: translateX(-50%) translate(-1.6px, -1px); } to { transform: translateX(-50%) translate(1.6px, -1px); } }
.team img { position: absolute; left: 50%; bottom: -4px; width: 118%; transform: translateX(-50%); }
.count { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 6; pointer-events: none; white-space: nowrap; font: 400 64px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
#v-title.counting .title-cta .sub { visibility: hidden; }
.count span { display: inline-block; animation: countPop .5s cubic-bezier(.2,.9,.3,1.3) both; text-shadow: 0 0 24px currentColor, 0 6px 30px rgba(0,0,0,.7); }
@keyframes countPop { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.flash { position: absolute; inset: 0; z-index: 7; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .55s ease-out both; }
@keyframes flash { 0% { opacity: 0; } 30% { opacity: .95; } 100% { opacity: 0; } }
#ballgl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.ball { position: absolute; left: 0; top: 0; z-index: 4; border-radius: 50%; touch-action: manipulation; will-change: transform; }
.ball::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; }   /* a finger-sized target, even for the tennis ball */
.ball canvas { width: 100%; height: 100%; display: block; }
#v-title.gl .ball canvas { visibility: hidden; }
.kick-hint { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 3; text-align: center; font: 700 10px/1 var(--body); letter-spacing: .3em; color: rgba(255,255,255,.45); text-transform: uppercase; }

/* ---------- home / season ---------- */
.top { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 12px; }
@media (min-width: 520px) { .top { padding-top: 30px; } }
.mini-logo { font: 400 22px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.mini-logo b { font: 400 15px/1 var(--marker); color: var(--ready); font-weight: 400; margin-right: 4px; }
.top .grow { flex: 1; }
.xp { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px 7px 9px; border-radius: 999px; background: var(--surface2); font: 800 13px/1 var(--body); font-variant-numeric: tabular-nums; }
.xp svg { color: var(--set); }
.xp.bump { animation: bump .5s cubic-bezier(.2,.9,.3,1.4); }
@keyframes bump { 40% { transform: scale(1.25); background: var(--set); color: #111; } }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); }
.hero { position: relative; margin: 6px 18px 0; padding: 20px 18px 18px; border-radius: 26px; overflow: hidden; --accent: var(--go); }
.hero > * { position: relative; }
.hero .big { font: 400 64px/.85 var(--display); font-variant-numeric: tabular-nums; }
.hero .big small { font-size: 28px; color: rgba(255,255,255,.7); }
.hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero .label { font: 800 12px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.hero .next { margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); width: 100%; text-align: left; }
.hero .next .t { flex: 1; min-width: 0; }
.hero .next .t b { display: block; font: 800 15px/1.25 var(--body); }
.hero .next .t span { font: 600 12px/1.3 var(--body); color: var(--muted); }
.hero .next .go { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--go); color: #07110a; flex: none; }
.meter { display: flex; gap: 4px; margin-top: 14px; }
.meter i { flex: 1; height: 8px; border-radius: 3px; background: rgba(255,255,255,.18); transform: skewX(-18deg); }
.meter i.on { background: var(--go); box-shadow: 0 0 10px color-mix(in srgb, var(--go) 60%, transparent); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 20px 12px; }
.section-h h2 { font: 400 26px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.sessions { display: grid; gap: 14px; padding: 0 16px 28px; }
.sess { position: relative; display: block; width: 100%; border-radius: 22px; overflow: hidden; text-align: left; background: #000; box-shadow: 0 12px 28px rgba(0,0,0,.5), inset 0 0 0 1px #1d2227; transition: transform .15s; }
.sess:active { transform: scale(.985); }
.sess.next { box-shadow: 0 0 0 2px var(--accent), 0 12px 34px color-mix(in srgb, var(--accent) 35%, transparent); }
.sess .art { position: relative; display: block; aspect-ratio: 3 / 2; overflow: hidden; isolation: isolate;
  background: radial-gradient(60% 80% at 72% 48%, color-mix(in srgb, var(--accent) 34%, #000) 0%, #000 72%); }
.sess .art::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.94) 0%, rgba(0,0,0,.78) 36%, rgba(0,0,0,0) 62%); }
.sess .beams { position: absolute; left: 72%; top: 46%; width: 190%; aspect-ratio: 1; translate: -50% -50%; opacity: .75; filter: blur(5px);
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--accent) 80%, transparent) 0deg 3deg, transparent 3deg 13deg);
  -webkit-mask: radial-gradient(closest-side, #000 6%, rgba(0,0,0,.55) 32%, transparent 68%); mask: radial-gradient(closest-side, #000 6%, rgba(0,0,0,.55) 32%, transparent 68%);
  animation: beamSpin 38s linear infinite; animation-play-state: paused; }
.sess .blob { position: absolute; aspect-ratio: 1; border-radius: 50%; mix-blend-mode: screen; pointer-events: none; animation-play-state: paused; }
.sess .b1 { width: 64%; left: 40%; top: 6%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 60%, #fff) 0%, var(--accent) 20%, color-mix(in srgb, var(--accent) 40%, transparent) 44%, transparent 68%);
  animation: drift1 6.5s ease-in-out infinite alternate; animation-play-state: paused; }
.sess .b2 { width: 46%; left: 56%; top: 30%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 80%, #fff) 0%, color-mix(in srgb, var(--accent) 55%, transparent) 34%, transparent 70%);
  animation: drift2 8.5s ease-in-out infinite alternate; animation-play-state: paused; }
.sess.live .beams, .sess.live .blob { animation-play-state: running; }
@keyframes beamSpin { to { rotate: 360deg; } }
@keyframes drift1 { from { transform: translate(-16%, 8%) scale(.88); opacity: .7; } to { transform: translate(10%, -8%) scale(1.14); opacity: 1; } }
@keyframes drift2 { from { transform: translate(14%, 10%) scale(1.1); opacity: .5; } to { transform: translate(-18%, -6%) scale(.84); opacity: .95; } }
.sess .silo-box { position: absolute; z-index: 2; right: 4%; top: 7%; width: 50%; height: 76%; }
.sess .silo-box img { display: block; width: 100%; height: 100%; object-fit: contain;
  filter: drop-shadow(0 0 1px color-mix(in srgb, var(--accent) 55%, #fff)) drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 60%, transparent)); }
.sess .art .sil { position: absolute; z-index: 2; left: 0; right: 0; bottom: -2px; height: 74%; background: var(--sil) center bottom / auto 100% no-repeat; filter: drop-shadow(0 -1px 0 color-mix(in srgb, var(--accent) 70%, #fff)); }
.sess .no { position: absolute; z-index: 3; left: 16px; top: 12px; font: 400 48px/1 var(--display); color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
.sess .info { position: absolute; z-index: 3; left: 0; bottom: 0; width: 60%; display: flex; flex-direction: column; gap: 7px; padding: 0 0 15px 16px; }
.sess .kicker { font: 800 10px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sess h3 { font: 400 23px/1.02 var(--display); text-transform: uppercase; letter-spacing: .01em; color: #fff; }
.sess .segs { display: flex; gap: 3px; }
.sess .segs i { width: 14px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.22); transform: skewX(-18deg); }
.sess .segs i.on { background: var(--accent); }
.sess .state { position: absolute; z-index: 3; right: 12px; bottom: 12px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); color: #fff; backdrop-filter: blur(4px); }
.sess.next .state { background: var(--accent); color: #0b0d0f; animation: pulse 1.6s ease-in-out infinite; }
.sess.done .state { background: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); } }
.tabs { position: relative; z-index: 4; display: flex; justify-content: space-around; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(9,11,13,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
@media (min-width: 520px) { .tabs { padding-bottom: 18px; } }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 14px; font: 700 11px/1 var(--body); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] svg { color: var(--go); }

/* ---------- step player ---------- */
#v-step { background: var(--app); }
.step-top { position: relative; z-index: 3; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px; background: linear-gradient(var(--app) 75%, transparent); }
@media (min-width: 520px) { .step-top { padding-top: 26px; } }
.step-top .row { display: flex; align-items: center; gap: 10px; }
.step-top .where { flex: 1; min-width: 0; }
.step-top .where b { display: block; font: 800 11px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.step-top .where span { display: block; font: 700 14px/1.25 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.race { position: relative; height: 34px; margin: 12px 4px 0; }
.race .rail { position: absolute; left: 10px; right: 10px; top: 16px; height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 13px); }
.race .fill { position: absolute; left: 10px; top: 16px; height: 3px; border-radius: 2px; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.race .node { position: absolute; top: 6px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); color: var(--muted); box-shadow: 0 0 0 3px var(--app); transition: background .3s, color .3s, transform .3s; }
.race .node svg { width: 12px; height: 12px; }
.race .node.done { background: var(--accent); color: #0b0d0f; }
.race .node.here { background: var(--ink); color: #0b0d0f; transform: scale(1.25); }
.step-body { padding: 6px 20px 120px; }
.step-head { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin: 8px 0 18px; }
.step-head h1 { font: 400 40px/.98 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.step-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; padding: 18px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(9,11,13,.94) 40%); pointer-events: none; }
@media (min-width: 520px) { .step-foot { padding-bottom: 22px; } }
.step-foot > * { pointer-events: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--surface2); font: 700 14px/1 var(--body); }
.pill[disabled] { opacity: .3; pointer-events: none; }
.foot-xp { font: 800 12px/1 var(--body); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
/* torn-paper arrow next button (YSB) */
.paper-next { position: relative; width: 78px; height: 61px; perspective: 520px; }
.paper-next img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; transform-origin: 50% 85%;
  filter: drop-shadow(0 7px 9px rgba(0,0,0,.55)) drop-shadow(0 1px 2px rgba(0,0,0,.45)); animation: paperIn .85s cubic-bezier(.2,.85,.3,1) both, paperIdle 3.4s ease-in-out .85s infinite; }
.paper-next:active img { filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)) brightness(.92); }
.paper-next .lbl { position: absolute; right: 84px; top: 50%; transform: translateY(-50%); white-space: nowrap; font: 400 15px/1 var(--marker); color: var(--ink); }
@keyframes paperIn { 0% { opacity: 0; transform: translateY(110px) rotateX(68deg) rotateZ(-9deg) scale(.62); } 58% { opacity: .7; transform: translateY(-9px) rotateX(-14deg) rotateZ(3deg) scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes paperIdle { 50% { transform: translateY(-4px) rotateZ(-1.5deg); } }

/* course aurora banner (Pathwright reflection header) on Warm-Up steps */
.banner { position: relative; margin: -6px -20px 18px; height: 220px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 12px; padding: 0 20px 18px;
  background-color: #000; background-size: cover; background-position: center 45%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(9,11,13,0) 45%, var(--app)); pointer-events: none; }
.banner > * { position: relative; z-index: 1; }
.banner h1 { font: 400 40px/.98 var(--display); text-transform: uppercase; letter-spacing: .01em; text-shadow: 0 4px 20px rgba(0,0,0,.6); }

/* content blocks */
.prose p { font: 400 17px/1.6 var(--body); color: #dfe4e1; }
.prose p + p, .prose p + .list, .prose .list + p { margin-top: 14px; }
.prose .lead { font: 600 21px/1.45 var(--body); color: var(--ink); }
.prose strong.lead-in { display: block; margin-top: 20px; font: 800 16px/1.45 var(--body); color: var(--ink); }
.prose h3 { margin: 30px 0 12px; font: 400 26px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--ink); }
.prose h3::before { content: ""; display: block; width: 34px; height: 4px; margin-bottom: 10px; background: var(--accent); transform: skewX(-20deg); }
.list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.list li { position: relative; padding: 12px 14px 12px 38px; border-radius: 14px; background: var(--surface); font: 500 16px/1.5 var(--body); color: #dfe4e1; }
.list li::before { content: ""; position: absolute; left: 15px; top: 20px; width: 10px; height: 10px; background: var(--accent); transform: rotate(45deg); }
.quote { position: relative; margin: 22px 0; padding: 22px 20px 20px; border-radius: 4px; background: var(--paper); color: var(--paper-ink); transform: rotate(-1deg); font: 600 18px/1.5 var(--body); box-shadow: 0 10px 24px rgba(0,0,0,.4); }
.quote::before { content: "\201C"; position: absolute; left: 12px; top: -26px; font: 400 80px/1 var(--display); color: var(--accent); }
.quote cite { display: block; margin-top: 10px; font: 400 15px/1 var(--marker); font-style: normal; color: #4a4f53; }

/* plays (expandable labelled items) */
.plays { display: grid; gap: 10px; margin: 16px 0; }
.plays-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.play { border-radius: 16px; background: var(--surface); overflow: hidden; text-align: left; width: 100%; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .2s; }
.play .ph { display: flex; align-items: center; gap: 12px; padding: 14px; }
.play .no { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--surface2); font: 400 18px/1 var(--display); color: var(--accent); }
.play .pl { flex: 1; font: 800 16px/1.3 var(--body); }
.play .chev { transition: transform .25s; color: var(--muted); }
.play .pb { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.play .pb > div { overflow: hidden; }
.play .pb p { padding: 0 16px 16px 60px; font: 400 16px/1.55 var(--body); color: #d4dad7; }
.play[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.play[aria-expanded="true"] .pb { grid-template-rows: 1fr; }
.play[aria-expanded="true"] .chev { transform: rotate(180deg); }
.play.seen .no { background: var(--accent); color: #0b0d0f; }

/* ready set go lights cards */
.rsg { display: grid; gap: 12px; margin: 18px 0; }
.rsg-card { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; padding: 16px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.rsg-card .rsg-tri { width: 44px; height: 50px; filter: drop-shadow(0 0 10px rgba(0,0,0,.4)); }
.rsg-card b { display: block; margin-bottom: 4px; font: 400 30px/1 var(--display); text-transform: uppercase; }
.rsg-card p { font: 400 15.5px/1.55 var(--body); color: #d4dad7; }

/* numbers chart */
.chart { margin: 20px 0; padding: 18px 16px 14px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.chart h4 { margin: 0 0 14px; font: 800 12px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: baseline; margin-bottom: 14px; }
.bar-row .bl { font: 700 14px/1.2 var(--body); }
.bar-row .bv { font: 400 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.bar-row .bt { grid-column: 1 / -1; height: 14px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.bar-row .bt i { display: block; height: 100%; width: var(--w); border-radius: 4px; background: #59626a; transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d); }
.bar-row.hi .bt i { background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); }
.bar-row.church .bt i { background: var(--ink); }
.bar-row .src { grid-column: 1 / -1; font: 500 11px/1 var(--body); color: var(--muted); }
@keyframes grow { from { transform: scaleX(0); } }

/* zones + strategies */
.zones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.zone { padding: 12px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; font: 800 14px/1.25 var(--body); min-height: 64px; }
.prose .zone small, .zone small { display: block; margin-top: 4px; font: 500 12px/1.35 var(--body); color: var(--muted); }
.zone[aria-pressed="true"] { background: var(--accent); color: #0b0d0f; box-shadow: none; }
.zone[aria-pressed="true"] small { color: rgba(0,0,0,.7); }
.strats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.strat { position: relative; padding: 14px 12px; border-radius: 16px; text-align: left; color: #0b0d0f; background: var(--c); min-height: 84px; overflow: hidden; }
.strat b { display: block; font: 400 22px/1 var(--display); text-transform: uppercase; }
.prose .strat p, .strat p { display: none; margin-top: 8px; font: 500 14px/1.45 var(--body); color: #0b0d0f; }
.strat .yours { position: absolute; right: 8px; top: 8px; font: 400 12px/1 var(--marker); background: #0b0d0f; color: var(--c); padding: 4px 7px; border-radius: 6px; transform: rotate(4deg); }
.strat[aria-expanded="true"] { grid-column: 1 / -1; }
.prose .strat[aria-expanded="true"] p, .strat[aria-expanded="true"] p { display: block; }

/* timeline */
.tl { position: relative; margin: 10px 0 0; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 3px; background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 20%, transparent)); border-radius: 2px; }
.tl .era { position: relative; margin: 26px 0 12px; font: 400 24px/1.05 var(--display); text-transform: uppercase; }
.tl .era::before { content: ""; position: absolute; left: -24px; top: 4px; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--app); }
.tl .ev { position: relative; margin-bottom: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font: 400 15.5px/1.55 var(--body); color: #d9dfdc; }
.tl .ev .yr { display: inline-block; margin-bottom: 6px; padding: 4px 8px; border-radius: 6px; background: var(--surface2); font: 400 15px/1 var(--display); letter-spacing: .04em; color: var(--accent); }

/* questions / inputs */
.q { margin: 0 0 18px; padding: 16px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.q label { display: block; font: 800 18px/1.35 var(--body); margin-bottom: 12px; }
.q textarea { display: block; width: 100%; min-height: 88px; padding: 12px 14px; border: 0; border-radius: 14px; background: var(--surface2); color: var(--ink); font: 400 16px/1.5 var(--body); resize: vertical; }
.q textarea::placeholder { color: #6c7679; }
.saved { margin-top: 8px; font: 700 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-height: 11px; }
.others-btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font: 700 14px/1 var(--body); color: var(--accent); }
.others { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.others span { padding: 8px 12px; border-radius: 999px; background: var(--surface2); font: 600 14px/1.25 var(--body); animation: chipIn .4s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes chipIn { from { opacity: 0; transform: translateY(10px) scale(.8); } }

/* video */
.tv { position: relative; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 16px 40px rgba(0,0,0,.5), inset 0 0 0 1px var(--line); }
.tv .screen { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; }
.tv .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tv .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.tv .poster-t { position: absolute; left: 14px; right: 14px; bottom: 12px; font: 400 26px/1 var(--display); text-transform: uppercase; text-shadow: 0 3px 12px rgba(0,0,0,.8); text-align: left; }
.tv .play-btn { position: relative; z-index: 2; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #0b0d0f; box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent), 0 10px 30px rgba(0,0,0,.5); animation: pulse 1.8s ease-in-out infinite; }
.tv .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0e1114; font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tv .bar .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ready); }
.tv .bar .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ready); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.tv .bar a { margin-left: auto; color: var(--ink); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.react { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.react button { flex: 1; min-width: 96px; padding: 12px 8px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: 700 13px/1.2 var(--body); }
.react button[aria-pressed="true"] { background: var(--accent); color: #0b0d0f; box-shadow: none; }
.hint { margin-top: 14px; font: 500 14px/1.5 var(--body); color: var(--muted); }

/* bible training */
.verse { position: relative; margin: 6px 0 22px; padding: 26px 22px 22px; background: var(--paper); color: var(--paper-ink); transform: rotate(-1.2deg); box-shadow: 0 14px 30px rgba(0,0,0,.5); width: 100%; text-align: left;
  clip-path: polygon(0 2%, 6% 0, 14% 2%, 25% 0, 37% 2%, 50% 0, 62% 2%, 75% 0, 87% 2%, 100% 0, 99% 50%, 100% 98%, 90% 100%, 78% 97%, 64% 100%, 50% 97%, 36% 100%, 22% 97%, 9% 100%, 0 98%, 1% 50%); }
.verse .ref { display: block; margin-bottom: 10px; font: 400 30px/1 var(--display); text-transform: uppercase; color: #0b0d0f; }
.verse .vt { font: 600 19px/1.5 var(--body); }
.verse .reads { display: flex; align-items: center; gap: 8px; margin-top: 16px; font: 400 15px/1 var(--marker); color: #50565a; }
.verse .reads i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #50565a; display: grid; place-items: center; }
.verse .reads i.on { background: var(--go); border-color: var(--go); }
.verse .reads i.on::after { content: ""; width: 9px; height: 5px; border: solid #0b0d0f; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); }

/* game plan */
.commit { margin: 0 0 14px; padding: 16px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.commit p { font: 700 17px/1.4 var(--body); }
.commit .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.lock { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface2); font: 800 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; }
.lock[aria-pressed="true"] { background: var(--accent); color: #0b0d0f; }
.commit textarea { margin-top: 12px; display: block; width: 100%; min-height: 70px; padding: 12px; border: 0; border-radius: 14px; background: var(--surface2); color: var(--ink); font: 400 15px/1.5 var(--body); resize: vertical; }
.commit.locked { box-shadow: inset 0 0 0 2px var(--accent); }
.memo { margin: 8px 0 22px; padding: 18px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.memo .ref { font: 400 20px/1 var(--display); text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.memo .words { display: flex; flex-wrap: wrap; gap: 6px; }
.memo .w { padding: 6px 9px; border-radius: 8px; background: var(--surface2); font: 700 17px/1.2 var(--body); transition: background .2s, color .2s; }
.memo .w.hid { color: transparent; background: color-mix(in srgb, var(--accent) 35%, var(--surface2)); }
.memo .acts { display: flex; gap: 8px; margin-top: 14px; }
.links { display: grid; gap: 10px; margin-top: 22px; }
.links a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; font: 800 15px/1.2 var(--body); }
.links a span { flex: 1; }
.links a small { display: block; font: 500 12px/1.3 var(--body); color: var(--muted); margin-top: 3px; }
.zone-note { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 18%, var(--surface)); font: 600 14px/1.45 var(--body); }
.clock { width: 64px; height: 64px; flex: none; }

/* ---------- session complete ---------- */
#v-done { align-items: center; justify-content: center; text-align: center; padding: 30px 26px; }
#v-done > * { position: relative; z-index: 2; }
.medal { position: relative; width: 170px; height: 210px; margin-bottom: 14px; animation: medalIn 1s cubic-bezier(.2,.9,.3,1.25) both; }
@keyframes medalIn { from { transform: translateY(-160px) rotate(-30deg) scale(.4); opacity: 0; } }
.medal .ribbon { position: absolute; left: 50%; top: 0; width: 86px; height: 92px; transform: translateX(-50%); background: linear-gradient(90deg, var(--accent) 0 33%, #fff 33% 66%, var(--accent) 66%); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.medal .disc { position: absolute; left: 50%; bottom: 0; width: 150px; height: 150px; transform: translateX(-50%); border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff6c9, #f2c64a 35%, #b07d12 75%, #7a5506); box-shadow: inset 0 0 0 8px rgba(255,255,255,.25), inset 0 -10px 20px rgba(0,0,0,.3), 0 14px 30px rgba(0,0,0,.5); animation: spinY 3.5s ease-in-out 1s infinite; }
.medal .disc b { font: 400 76px/1 var(--display); color: #5a3f05; text-shadow: 0 2px 0 rgba(255,255,255,.4); }
@keyframes spinY { 50% { transform: translateX(-50%) rotateY(180deg); } }
#v-done h1 { font: 400 46px/.95 var(--display); text-transform: uppercase; }
#v-done .sub { margin-top: 10px; font: 600 16px/1.45 var(--body); color: #dfe4e1; }
.stats { display: flex; gap: 10px; margin: 22px 0 26px; }
.stats div { padding: 12px 16px; border-radius: 16px; background: rgba(0,0,0,.5); min-width: 92px; }
.stats b { display: block; font: 400 32px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font: 800 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.done-acts { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 290px; }
#fx { position: absolute; inset: 0; z-index: 20; pointer-events: none; width: 100%; height: 100%; }

/* ---------- playbook (journal) + about ---------- */
.page-h { padding: 6px 20px 4px; }
.page-h h1 { font: 400 44px/1 var(--display); text-transform: uppercase; }
.page-h p { margin-top: 8px; font: 500 15px/1.5 var(--body); color: var(--muted); }
.jgroup { margin: 18px 20px 0; }
.jgroup h2 { display: flex; align-items: center; gap: 10px; font: 400 22px/1.1 var(--display); text-transform: uppercase; margin-bottom: 10px; }
.jgroup h2 i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #0b0d0f; font: 400 17px/1 var(--display); font-style: normal; }
.jitem { margin-bottom: 10px; padding: 14px; border-radius: 16px; background: var(--surface); }
.jitem .jq { font: 700 13px/1.4 var(--body); color: var(--muted); }
.jitem .ja { margin-top: 6px; font: 500 16px/1.5 var(--body); white-space: pre-wrap; }
.empty { margin: 30px 20px; padding: 26px 20px; border-radius: 22px; background: var(--surface); text-align: center; }
.empty b { display: block; font: 400 26px/1.1 var(--display); text-transform: uppercase; margin-bottom: 8px; }
.empty p { font: 500 15px/1.5 var(--body); color: var(--muted); }
.page-acts { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 20px 30px; }
.about-body { padding: 10px 20px 30px; }
.about-body .prose p { font-size: 16px; }
.topics { counter-reset: t; display: grid; gap: 8px; margin: 18px 0; padding: 0; list-style: none; }
.topics li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface); font: 700 15px/1.3 var(--body); }
.topics li i { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--c); color: #0b0d0f; font: 400 18px/1 var(--display); font-style: normal; }
.confirm { margin-top: 12px; padding: 14px; border-radius: 16px; background: color-mix(in srgb, var(--ready) 18%, var(--surface)); }
.confirm p { font: 600 14px/1.45 var(--body); margin-bottom: 12px; }
.credit { margin-top: 26px; font: 500 12px/1.5 var(--body); color: var(--muted); }

/* toast */
#toast { position: absolute; left: 50%; top: calc(124px + env(safe-area-inset-top, 0px)); z-index: 30; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: 999px; background: var(--set); color: #111; font: 800 14px/1 var(--body); letter-spacing: .04em; white-space: nowrap; transition: opacity .25s, transform .25s; box-shadow: 0 10px 24px rgba(0,0,0,.4); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* RSG TV: the RSG triangles in silhouette, lit from both sides by studio lamps in the session colour */
.tv .screen { background: radial-gradient(70% 85% at 50% 42%, color-mix(in srgb, var(--accent) 16%, #000) 0%, #020304 78%); }
.tvset { position: absolute; inset: 0; overflow: hidden; }
.tvset::before { content: ""; position: absolute; left: 50%; top: 42%; width: 60%; aspect-ratio: 1.5; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 55%, transparent), transparent 75%); filter: blur(10px); animation: backGlow 3.2s ease-in-out infinite alternate; }
@keyframes backGlow { from { opacity: .4; transform: scale(.92); } to { opacity: .85; transform: scale(1.06); } }
.tvlogo { position: absolute; z-index: 2; left: 50%; top: 42%; width: 50%; translate: -50% -50%; }
.tv .tvlogo img { position: static; display: block; width: 100%; height: auto; object-fit: contain; animation: rimSweep 4.2s ease-in-out infinite alternate; }
@keyframes rimSweep {
  from { filter: drop-shadow(-2px -1px 0 color-mix(in srgb, var(--accent) 80%, #fff)) drop-shadow(-9px 0 14px color-mix(in srgb, var(--accent) 75%, transparent)) drop-shadow(1px 0 0 color-mix(in srgb, var(--accent) 35%, transparent)); }
  to { filter: drop-shadow(2px -1px 0 color-mix(in srgb, var(--accent) 80%, #fff)) drop-shadow(9px 0 14px color-mix(in srgb, var(--accent) 75%, transparent)) drop-shadow(-1px 0 0 color-mix(in srgb, var(--accent) 35%, transparent)); } }
.spot { position: absolute; z-index: 3; top: 11%; width: 30px; height: 20px; border-radius: 5px; background: linear-gradient(#2c3137, #111418); box-shadow: 0 3px 8px rgba(0,0,0,.7); }
.spot::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 3px; height: 70px; translate: -50% 0; background: #1b1f24; }
.spot::after { content: ""; position: absolute; top: 3px; bottom: 3px; width: 7px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 45%, #fff);
  box-shadow: 0 0 10px var(--accent), 0 0 24px var(--accent); animation: lampFlick 4.2s ease-in-out infinite alternate; }
.spot.sl { left: 3%; transform: rotate(24deg); } .spot.sl::after { right: -2px; }
.spot.sr { right: 3%; transform: rotate(-24deg); } .spot.sr::after { left: -2px; animation-direction: alternate-reverse; }
@keyframes lampFlick { from { opacity: 1; } to { opacity: .55; } }
.beam { position: absolute; z-index: 1; top: 7%; width: 68%; height: 74%; mix-blend-mode: screen; filter: blur(7px); pointer-events: none; }
.beam.bl { left: 8%; transform-origin: 0 16%; clip-path: polygon(0 10%, 100% 0, 100% 100%, 0 22%);
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, #fff) 0%, color-mix(in srgb, var(--accent) 45%, transparent) 35%, transparent 92%);
  animation: sweepL 4.2s ease-in-out infinite alternate; }
.beam.br { right: 8%; transform-origin: 100% 16%; clip-path: polygon(100% 10%, 0 0, 0 100%, 100% 22%);
  background: linear-gradient(270deg, color-mix(in srgb, var(--accent) 70%, #fff) 0%, color-mix(in srgb, var(--accent) 45%, transparent) 35%, transparent 92%);
  animation: sweepR 4.2s ease-in-out infinite alternate; }
@keyframes sweepL { from { transform: rotate(9deg); opacity: .95; } to { transform: rotate(-5deg); opacity: .5; } }
@keyframes sweepR { from { transform: rotate(5deg); opacity: .5; } to { transform: rotate(-9deg); opacity: .95; } }
.tv .play-btn { position: absolute; right: 14px; bottom: 12px; width: 54px; height: 54px; z-index: 4; }
.tv .poster-t { z-index: 4; right: 84px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
